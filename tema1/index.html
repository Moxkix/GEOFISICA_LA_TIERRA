<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tema 1 · La Tierra planeta</title>
<meta name="description" content="Interactivos del Tema 1 de Geografía General I (Geografía Física, UNED): forma y movimientos de la Tierra y su representación cartográfica.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23cfe0ea' stroke='%231c2836' stroke-width='2'/%3E%3Cpath d='M2 16h28M16 2c-6 7-6 21 0 28M16 2c6 7 6 21 0 28' fill='none' stroke='%231c2836' stroke-width='1.5'/%3E%3C/svg%3E">
<style>:root{
  --paper:#f6f3ea; --card:#fffdf8; --ink:#1c2836; --muted:#5a6878; --line:#ddd5c3; --soft:#efe9da;
  --accent:#b4531d; --accent-soft:#f6e3d6; --blue:#1f6f8b; --blue-soft:#dcebf1;
  --ok:#2d7a4c; --ok-soft:#e1f1e6; --bad:#b0393a; --bad-soft:#f7e1df; --warn:#8a6512; --warn-soft:#f6edd2;
  --land:#e4d3a8; --ocean:#cfe0ea;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em}
h2{font-size:1.7rem} h3{font-size:1.2rem;margin-top:.2em} h4{font-size:1.02rem}
p{margin:.4em 0 .8em}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
small,.small{font-size:.86rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header.top{background:var(--ink);color:#f3efe4;padding:14px 20px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand{display:flex;flex-direction:column;flex:1;min-width:240px}
.brand .kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#d9b48f}
.brand .title{font-family:var(--serif);font-size:1.22rem;line-height:1.2}
.place-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 6px 5px 14px;cursor:pointer;color:#f3efe4;max-width:100%}
.place-pill:hover{background:rgba(255,255,255,.14)}
.place-pill .lbl{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.place-pill b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.place-pill .chg{background:#d9b48f;color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:12px auto 0;scrollbar-width:thin}
nav.tabs .grp{display:flex;flex-direction:column;flex:none}
nav.tabs .grp-name{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#d9b48f;padding:0 10px;opacity:.85}
nav.tabs .grp-btns{display:flex;gap:2px}
nav.tabs button{background:transparent;border:0;color:#cfd6df;padding:7px 12px 10px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-size:.93rem}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);font-weight:600}
nav.tabs .sep{width:1px;background:rgba(255,255,255,.15);margin:14px 6px 6px}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.intro{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.intro .lead{color:var(--muted);max-width:820px;margin:0}
.intro .ref{font-size:.8rem;color:var(--muted);text-align:right;border-left:3px solid var(--accent);padding-left:10px}
.intro .eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.card>h3:first-child{margin-top:0}
.card .sub{color:var(--muted);font-size:.92rem;margin-top:-.2em}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid2.even{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2,.grid2.even,.grid3{grid-template-columns:1fr}.intro{grid-template-columns:1fr}.intro .ref{text-align:left}}

.viz{position:relative;width:100%}
.viz canvas,.viz svg{display:block;width:100%;height:auto;border-radius:8px}
.viz.framed canvas,.viz.framed svg{border:1px solid var(--line);background:#fff}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.hint::before{content:"↳ ";color:var(--accent)}

/* controles */
.ctrl{margin:0 0 12px}
.ctrl label,.ctrl .lab{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;margin-bottom:3px}
.ctrl label output,.ctrl .lab output{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:.86rem}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=text],input[type=date],select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:.86rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:#2c3e53}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;margin-right:14px;cursor:pointer}
.chk input{accent-color:var(--accent)}

/* lecturas */
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ro{background:var(--soft);border-radius:8px;padding:8px 10px}
.ro .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ro .v{font-family:var(--serif);font-size:1.25rem;font-variant-numeric:tabular-nums}
.ro .v small{font-family:var(--sans)}
.ro.hl{background:var(--accent-soft)}
.ro.bl{background:var(--blue-soft)}
.formula{font-family:var(--serif);font-style:italic;background:var(--soft);padding:6px 10px;border-radius:6px;display:inline-block}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.t td.bad{color:var(--bad)} table.t td.good{color:var(--ok);font-weight:600}

/* notas de corrección */
.fix{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.fix .fh{font-weight:700;color:var(--warn);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.fix ul{margin:.2em 0;padding-left:1.2em}
.fix s{color:var(--bad);text-decoration-thickness:1.5px}
.info{border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}

/* autoevaluación */
.selfcheck{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-top:8px}
.selfcheck>h3{display:flex;align-items:center;gap:10px}
.selfcheck>h3 .score{margin-left:auto;font-family:var(--sans);font-size:.85rem;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 12px}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:8px}
.q .qt .n{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:.93rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .l{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;font-size:.9rem;padding:8px 11px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
details.open-q{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:#fff}
details.open-q summary{cursor:pointer;font-weight:600}
details.open-q .ans{margin-top:8px;font-size:.93rem;border-top:1px dashed var(--line);padding-top:8px}

/* buscador municipio */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,40,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-top:0}
.sugg{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;background:#fff}
.sugg li{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;gap:10px}
.sugg li:last-child{border-bottom:0}
.sugg li:hover,.sugg li.sel{background:var(--accent-soft)}
.sugg li small{white-space:nowrap}
.modal .alt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
.modal .alt>div{flex:1;min-width:100px}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr);gap:18px;align-items:start;margin-bottom:18px}
.toc3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.cmap svg{width:100%;height:auto}
.cmap .node{cursor:pointer}
.cmap .node rect{fill:#fff;stroke:var(--ink);stroke-width:1.2;transition:fill .15s}
.cmap .node:hover rect{fill:var(--accent-soft)}
.cmap .node text{font-family:var(--sans);font-size:13.5px;fill:var(--ink);pointer-events:none}
.cmap .node.root rect{fill:var(--ink)} .cmap .node.root text{fill:#fff;font-weight:700}
.cmap .node.hub rect{fill:var(--soft)}
.cmap .node.dis{cursor:default}.cmap .node.dis rect,.cmap .node.dis:hover rect{fill:#f3f0e8;stroke:#b7ae9c;stroke-dasharray:4 3}.cmap .node.dis text{fill:#8a8272}
.cmap .node.ext rect{stroke:var(--blue);stroke-dasharray:5 3}
.cmap .node text.tag{font-size:9.5px;fill:var(--blue);font-weight:700;letter-spacing:.04em}
.tlegend{margin-top:6px}
.wide-svg{overflow-x:auto}
@media (max-width:700px){.wide-svg svg{min-width:640px}}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}
.chipbar .chip{font-family:var(--sans);font-size:.82rem;padding:4px 10px}
.flowtable td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmap .edge{stroke:#8a96a3;stroke-width:1.2;fill:none}
.cmap .tag{font-size:10px;fill:var(--accent);font-weight:700;letter-spacing:.04em}
.toc{display:grid;gap:8px}
.toc a{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.toc a:hover{border-color:var(--accent)}
.toc a .i{font-family:var(--serif);font-size:1.3rem;color:var(--accent);text-align:center}
.toc a .d{font-size:.83rem;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;font-size:.8rem;color:var(--muted)}

.tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.8rem;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:5;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.badge.c{background:#e2ecf8;color:#24538a}.badge.e{background:#e3f1e3;color:#2d6a3a}.badge.q{background:#f6e7d6;color:#8a4b14}.badge.n{background:#eee;color:#666}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.kbd{font-family:var(--mono);font-size:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.clock{font-family:var(--serif);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.ko{background:var(--bad-soft);color:var(--bad)}
.sortlist{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:#fff}
.chip{border:1px solid var(--ink);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;font-family:var(--mono);font-size:.88rem}
.chip.sel{background:var(--ink);color:#fff}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)} .chip.ko{border-color:var(--bad);background:var(--bad-soft)}
.exam-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.result-box{text-align:center;padding:20px;border-radius:12px;background:var(--soft);margin-bottom:12px}
.result-box .big{font-family:var(--serif);font-size:3rem;line-height:1}
@media print{header.top,nav.tabs{display:none}section.tab{display:block!important}}
.brand .kicker .home-link{color:#f3efe4;text-decoration:none;font-weight:700;border-bottom:1px solid rgba(243,239,228,.4)}
.brand .kicker .home-link:hover{border-bottom-color:#f3efe4}
@media (max-width:700px){header.top{position:static}.brand .kicker{font-size:0;letter-spacing:0}.brand .kicker .home-link{font-size:.75rem;letter-spacing:.1em}.brand .title{font-size:1.05rem}main{padding:16px 12px 50px}h2{font-size:1.4rem}.card{padding:14px 12px}}
.ro.wide{grid-column:1/-1}.ro.wide .v{font-size:1.1rem}
</style>
</head>

</header>

      for (const v of o.hlines || []) { const y = Y(v.y); ctx.strokeStyle = v.color || '#888'; ctx.setLineDash(v.dash || [4, 4]); ctx.beginPath(); ctx.moveTo(P.l, y); ctx.lineTo(w - P.r, y); ctx.stroke(); ctx.setLineDash([]); if (v.label) { ctx.fillStyle = v.color || '#888'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(v.label, w - P.r - 2, y - 2); } }

/* ===================== 1 · FORMA Y DIMENSIONES ===================== */
H.tab({
  id: 'forma', nav: 'Forma y dimensiones', title: 'Forma y dimensiones',
  init(el) {
    el.append(H.intro('Planeta · apartado 1', 'Forma y dimensiones de la Tierra',
      'La Tierra no es exactamente una esfera: es un elipsoide achatado por los polos y, con más precisión, un geoide. Empieza por reproducir el razonamiento de Eratóstenes, que estimó su tamaño en el siglo III a. C. con una sombra y una distancia.',
      'Manual: 1.1 y 1.2<br>Figuras 1.1 y 1.2'));

    /* ---------- A · Eratóstenes ---------- */
    const st = { th: 7.2, est: 5000, km: 800, unit: 'est', stadion: 157.5 };
    const svgBox = H.h('div', { class: 'viz framed' });
    const ro = { cst: H.ro('Circunferencia', 'hl'), ckm: H.ro('En kilómetros', 'hl'), r: H.ro('Radio deducido'), err: H.ro('Diferencia con 40.075 km', 'bl') };
    const thS = H.slider('Ángulo de la sombra en Alejandría (θ)', 5, 10, 0.1, st.th, (v) => H.f(v, 1) + '° = 1/' + H.f(360 / v, 1) + ' de circunferencia', (v) => { st.th = v; upd(); });
    const dS = H.slider('Distancia Siena–Alejandría', 4000, 6000, 50, st.est, (v) => H.f(v) + ' estadios', (v) => { st.est = v; upd(); });
    const kS = H.slider('Distancia Siena–Alejandría', 600, 1000, 5, st.km, (v) => H.f(v) + ' km', (v) => { st.km = v; upd(); });
    const stadSeg = H.seg([[157.5, 'Egipcio · 157,5 m'], [185, 'Ático · 185 m'], [192.3, 'Olímpico · 192,3 m']], st.stadion, (v) => { st.stadion = v; upd(); });
    const stadBox = H.h('div', { class: 'ctrl' }, H.h('div', { class: 'lab' }, 'Longitud del estadio (incierta)'), stadSeg);
    const unitSeg = H.seg([['est', 'Datos originales (estadios)'], ['km', 'Datos en km (como el manual)']], 'est', (v) => { st.unit = v; upd(); });
    const presets = H.h('div', { class: 'row', style: { marginTop: '4px' } },
      H.h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { st.unit = 'est'; unitSeg.set('est'); st.th = 7.2; thS.set(7.2); st.est = 5000; dS.set(5000); upd(); } }, 'Eratóstenes: 7,2° y 5.000 est.'),
      H.h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { st.unit = 'km'; unitSeg.set('km'); st.th = 7; thS.set(7); st.km = 800; kS.set(800); upd(); } }, 'Manual: 7° y 800 km'));

    const drawSvg = () => {
      const k = 3, tv = st.th * k * H.D2R, cx = 330, cy = 430, R = 265;
      const P = (a, r = R) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
      const S = P(0), A = P(-tv), n = [Math.sin(-tv), -Math.cos(-tv)];
      const T = [A[0] + 70 * n[0], A[1] + 70 * n[1]];
      // sombra: rayo vertical desde T hasta la superficie
      const dx = T[0] - cx; const sy = cy - Math.sqrt(R * R - dx * dx); const Sh = [T[0], sy];
      const arc = (c, r, a0, a1) => { const p0 = [c[0] + r * Math.sin(a0), c[1] - r * Math.cos(a0)], p1 = [c[0] + r * Math.sin(a1), c[1] - r * Math.cos(a1)]; return `M${p0[0]} ${p0[1]} A ${r} ${r} 0 0 ${a1 > a0 ? 1 : 0} ${p1[0]} ${p1[1]}`; };
      let s = `<svg viewBox="0 0 600 470" role="img" aria-label="Esquema del método de Eratóstenes">
        <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d79a2b"/></marker>
        <radialGradient id="eg" cx="50%" cy="20%" r="80%"><stop offset="0" stop-color="#f1e6c8"/><stop offset="1" stop-color="#d9c48f"/></radialGradient></defs>
        <rect width="600" height="470" fill="#fbfaf6"/><style>.lb{paint-order:stroke;stroke:#fbfaf6;stroke-width:4px;stroke-linejoin:round}</style>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#eg)" stroke="#1c2836" stroke-width="1.5"/>`;
      for (let x = 40; x <= 560; x += 40) { const ddx = x - cx; if (Math.abs(ddx) >= R) continue; const yy = cy - Math.sqrt(R * R - ddx * ddx); s += `<line x1="${x}" y1="18" x2="${x}" y2="${yy - 6}" stroke="#d79a2b" stroke-width="1.3" marker-end="url(#ar)" opacity=".75"/>`; }
      s += `<text x="20" y="14" font-size="12" fill="#a8741a" font-weight="700">☀ Rayos solares paralelos (el Sol está muy lejos)</text>`;
      // radios al centro
      s += `<line x1="${cx}" y1="${cy}" x2="${S[0]}" y2="${S[1]}" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
            <line x1="${cx}" y1="${cy}" x2="${A[0]}" y2="${A[1]}" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
            <path d="${arc([cx, cy], 70, -tv, 0)}" fill="none" stroke="#b4531d" stroke-width="2"/>
            <text x="${cx - 26}" y="${cy - 80}" font-size="14" fill="#b4531d" font-weight="700" text-anchor="middle">θ</text>
            <circle cx="${cx}" cy="${cy}" r="3" fill="#1c2836"/><text x="${cx + 8}" y="${cy - 4}" font-size="11" fill="#5a6878">centro</text>`;
      // arco de superficie
      s += `<path d="${arc([cx, cy], R + 14, -tv, 0)}" fill="none" stroke="#1c2836" stroke-width="1" marker-end="url(#ar)"/>
            <text class="lb" x="${(S[0] + A[0]) / 2}" y="${Math.min(S[1], A[1]) - 22}" font-size="12" text-anchor="middle" fill="#1c2836">${st.unit === 'est' ? H.f(st.est) + ' estadios' : H.f(st.km) + ' km'}</text>`;
      // pozo de Siena
      s += `<rect x="${S[0] - 6}" y="${S[1]}" width="12" height="26" fill="#1c2836"/><circle cx="${S[0]}" cy="${S[1] + 22}" r="4" fill="#ffd34d"/>
            <text class="lb" x="${S[0] + 12}" y="${S[1] + 18}" font-size="12" fill="#1c2836"><tspan font-weight="700">Siena (Asuán)</tspan><tspan x="${S[0] + 12}" dy="14">Sol en el cénit: ilumina el fondo del pozo</tspan></text>`;
      // gnomon y sombra en Alejandría
      s += `<line x1="${A[0]}" y1="${A[1]}" x2="${T[0]}" y2="${T[1]}" stroke="#1c2836" stroke-width="3"/>
            <line x1="${T[0]}" y1="${T[1] - 30}" x2="${Sh[0]}" y2="${Sh[1]}" stroke="#d79a2b" stroke-width="1.5"/>
            <line x1="${A[0]}" y1="${A[1]}" x2="${Sh[0]}" y2="${Sh[1]}" stroke="#333" stroke-width="5" stroke-linecap="round" opacity=".55"/>
            <path d="${arc(T, 26, Math.PI - tv, Math.PI)}" fill="none" stroke="#b4531d" stroke-width="2"/>
            <text x="${T[0] + 4}" y="${T[1] + 42}" font-size="13" fill="#b4531d" font-weight="700">θ</text>
            <text class="lb" x="${T[0] - 10}" y="${T[1] - 4}" font-size="12" text-anchor="end" fill="#1c2836"><tspan font-weight="700">Alejandría</tspan><tspan x="${T[0] - 10}" dy="14">gnomon y su sombra</tspan></text>
            <text x="16" y="462" font-size="11" fill="#5a6878">Ángulos exagerados ×3. Los dos ángulos θ son iguales (alternos internos entre paralelas).</text></svg>`;
      svgBox.innerHTML = s;
    };
    const upd = () => {
      dS.style.display = st.unit === 'est' ? '' : 'none'; stadBox.style.display = st.unit === 'est' ? '' : 'none'; kS.style.display = st.unit === 'km' ? '' : 'none';
      const frac = 360 / st.th;
      const dkm = st.unit === 'est' ? st.est * st.stadion / 1000 : st.km;
      const C = frac * dkm;
      ro.cst.v.innerHTML = st.unit === 'est' ? `${H.f(frac * st.est)} <small>estadios</small>` : `${H.f(frac, 2)} × ${H.f(st.km)} km`;
      ro.ckm.v.innerHTML = `${H.f(C)} <small>km</small>`;
      ro.r.v.innerHTML = `${H.f(C / (2 * Math.PI))} <small>km</small>`;
      const e = (C - 40075) / 40075 * 100; ro.err.v.innerHTML = `${H.fs(e, 1)} %`;
      drawSvg();
    };
    const cardA = H.h('div', { class: 'card' }, H.h('h3', {}, 'El experimento de Eratóstenes'),
      H.h('p', { class: 'sub' }, 'El día del solsticio de verano, a mediodía, el Sol estaba en la vertical de Siena y en Alejandría un gnomon proyectaba una sombra de unos 7,2°. Si la Tierra es esférica y los rayos llegan paralelos, ese ángulo es la fracción de la circunferencia que separa ambas ciudades.'),
      H.h('div', { class: 'grid2' }, svgBox,
        H.h('div', {}, unitSeg, H.h('div', { style: { height: '10px' } }), thS, dS, kS, stadBox, presets,
          H.h('div', { class: 'readouts', style: { marginTop: '12px' } }, ro.cst, ro.ckm, ro.r, ro.err),
          H.h('p', { class: 'small', html: '<span class="formula">C = d × 360° / θ</span> &nbsp; Siena está casi sobre el trópico de Cáncer (24° 05′ N): por eso allí el Sol llega a la vertical en el solsticio de junio.' }))));
    el.append(cardA);
    upd();

    /* ---------- B · Esfera, elipsoide, geoide ---------- */
    const g = { k: 25, show: { sph: true, ell: true, geo: true } };
    const cv = H.h('canvas');
    const cvs = H.autoCanvas(cv, (w) => Math.min(w * 0.82, 470), (ctx, w, h) => {
      ctx.fillStyle = '#fbfaf6'; ctx.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.42;
      const f = H.K.f * g.k;
      const ellR = (t) => { const a = R * (1 + f / 3), b = a * (1 - f); return a * b / Math.hypot(b * Math.cos(t), a * Math.sin(t)); }; // t = ángulo desde el ecuador
      const geoN = (t) => (60 * Math.sin(3 * t + 0.6) + 32 * Math.cos(5 * t - 0.4) + 18 * Math.sin(9 * t)) / 6371000 * R * g.k * 12;
      const path = (fn, col, lw, dash) => { ctx.beginPath(); for (let i = 0; i <= 360; i++) { const t = i * H.D2R, r = fn(t); const x = cx + r * Math.cos(t), y = cy - r * Math.sin(t); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); };
      if (g.show.ell) { ctx.beginPath(); for (let i = 0; i <= 360; i++) { const t = i * H.D2R, r = ellR(t); const x = cx + r * Math.cos(t), y = cy - r * Math.sin(t); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.fillStyle = 'rgba(228,211,168,.45)'; ctx.fill(); path(ellR, '#1c2836', 2); }
      if (g.show.sph) path(() => R, '#1f6f8b', 1.5, [6, 5]);
      if (g.show.geo) path((t) => ellR(t) + geoN(t), '#b4531d', 2);
      // ejes
      ctx.strokeStyle = 'rgba(28,40,54,.35)'; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(cx - R * 1.15, cy); ctx.lineTo(cx + R * 1.15, cy); ctx.moveTo(cx, cy - R * 1.15); ctx.lineTo(cx, cy + R * 1.15); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#1c2836'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';

H.globe = (canvas, opts = {}) => {
  const G = { lat0: opts.lat0 ?? 30, lon0: opts.lon0 ?? 0, marks: [], lines: [], grid: opts.grid ?? 15, onClick: null, overlay: null, night: null };
  let cache = null, cacheKey = '';
  G.par = (la) => { const a = []; for (let lo = -180; lo <= 180; lo += 2) a.push([la, lo]); return a; };
  G.mer = (lo) => { const a = []; for (let la = -90; la <= 90; la += 2) a.push([la, lo]); return a; };
  const st = H.autoCanvas(canvas, (w) => Math.min(w, opts.max ?? 520), (ctx, w, h) => {
    const S = Math.min(w, h), r = S / 2 - 6, cx = w / 2, cy = h / 2;
    G.r = r; G.cx = cx; G.cy = cy;
    const pr = H.ortho(G.lat0, G.lon0); G.pr = pr;
    const N = Math.round(2 * r);
    const key = [G.lat0.toFixed(2), G.lon0.toFixed(2), N, G.night ? G.night.join() : ''].join('|');
    if (key !== cacheKey) {
      const img = ctx.createImageData(N, N); const d = img.data;
      const ns = G.night ? (() => { const [la, lo] = G.night; const p = la * H.D2R, l = lo * H.D2R; return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)]; })() : null;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const x = (i + 0.5 - r) / r, y = (r - j - 0.5) / r; const ll = pr.inv(x, y); const k = (j * N + i) * 4;
        if (!ll) { d[k + 3] = 0; continue; }
        let c = H.surface(ll[0], ll[1]);
        const shade = 0.78 + 0.22 * Math.sqrt(Math.max(0, 1 - x * x - y * y));
        let f = shade;
        if (ns) { const p = ll[0] * H.D2R, l = ll[1] * H.D2R; const dot = Math.cos(p) * Math.cos(l) * ns[0] + Math.cos(p) * Math.sin(l) * ns[1] + Math.sin(p) * ns[2]; const t = H.clamp((dot + 0.06) / 0.12, 0, 1); f *= 0.42 + 0.58 * t; }
        d[k] = c[0] * f; d[k + 1] = c[1] * f; d[k + 2] = c[2] * f; d[k + 3] = 255;
      }
      const off = document.createElement('canvas'); off.width = N; off.height = N; off.getContext('2d').putImageData(img, 0, 0);
      cache = off; cacheKey = key;
    }
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(cache, cx - r, cy - r, 2 * r, 2 * r);
    ctx.strokeStyle = '#1c2836'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    const P = (la, lo) => { const p = pr.fwd(la, lo); return [cx + p[0] * r, cy - p[1] * r, p[2]]; };
    G.P = P;
    const poly = (pts, col, lw, dash) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); let on = false; for (const [la, lo] of pts) { const p = P(la, lo); if (p[2] < 0) { on = false; continue; } on ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); on = true; } ctx.stroke(); ctx.setLineDash([]); };
    G.poly = poly;
    const par = G.par, mer = G.mer;
    if (G.grid) {
      for (let la = -90 + G.grid; la < 90; la += G.grid) if (la) poly(par(la), H.COL.grid, 0.8);
      for (let lo = -180; lo < 180; lo += G.grid) if (lo) poly(mer(lo), H.COL.grid, 0.8);
      poly(par(0), '#1c2836', 1.6); poly(mer(0), '#1c2836', 1.6);
    }
    for (const L of G.lines) poly(L.pts, L.color, L.width || 2, L.dash);
    if (G.overlay) G.overlay(ctx, P, w, h);
    for (const m of G.marks) {
      const p = P(m.lat, m.lon); if (p[2] < 0) continue;
      ctx.fillStyle = m.color || '#b4531d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p[0], p[1], m.r || 5, 0, 7); ctx.fill(); ctx.stroke();
      if (m.label) { ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.strokeText(m.label, p[0] + 7, p[1] - 3); ctx.fillStyle = m.color || '#b4531d'; ctx.fillText(m.label, p[0] + 7, p[1] - 3); }
    }
  });
  G.st = st; G.redraw = st.redraw;
  // arrastrar para girar, clic para seleccionar
  let start = null, moved = false;
  H.drag(canvas, {
    down: (e) => { start = st.pos(e); moved = false; start.push(G.lat0, G.lon0); },
    move: (e) => { const p = st.pos(e); const dx = p[0] - start[0], dy = p[1] - start[1]; if (Math.hypot(dx, dy) > 3) moved = true; if (!moved) return; const k = 90 / G.r; G.lon0 = ((start[3] - dx * k + 540) % 360) - 180; G.lat0 = H.clamp(start[2] + dy * k, -90, 90); st.redraw(); },
    up: (e) => { if (!moved && G.onClick && start) { const x = (start[0] - G.cx) / G.r, y = (G.cy - start[1]) / G.r; const ll = G.pr.inv(x, y); if (ll) G.onClick(ll[0], ll[1]); } },
  });
  canvas.style.cursor = 'grab';
  return G;
};

/* ===================== 7 · PROYECCIONES ===================== */
H.PROJ = (() => {
  const D = Math.PI / 180, PI = Math.PI, S2 = Math.SQRT2;
  const wrap = (l) => { while (l > PI) l -= 2 * PI; while (l < -PI) l += 2 * PI; return l; };
  const mollTheta = (p) => { if (Math.abs(p) > PI / 2 - 1e-9) return Math.sign(p) * PI / 2; let t = p; for (let i = 0; i < 30; i++) { const d = -(2 * t + Math.sin(2 * t) - PI * Math.sin(p)) / (2 + 2 * Math.cos(2 * t)); t += d; if (Math.abs(d) < 1e-10) break; } return t; };
  const P = {};
  P.equi = { name: 'Equirectangular (cilíndrica simple)', fam: 'Cilíndrica', prop: ['q', 'Equidistante en los meridianos'],
    fwd: (p, l) => [l, p], inv: (x, y) => (Math.abs(x) <= PI && Math.abs(y) <= PI / 2) ? [y, x] : null, b: [-PI, PI, -PI / 2, PI / 2],
    txt: 'Meridianos y paralelos son rectas equiespaciadas: una cuadrícula regular. Conserva las distancias a lo largo de los meridianos, pero estira los paralelos hacia los polos. Muy usada para datos raster globales (SIG).' };
  P.merc = { name: 'Mercator', fam: 'Cilíndrica', prop: ['c', 'Conforme'], lim: 85,
    fwd: (p, l) => Math.abs(p) > 85 * D ? null : [l, Math.log(Math.tan(PI / 4 + p / 2))], inv: (x, y) => (Math.abs(x) <= PI && Math.abs(y) <= 3.13) ? [2 * Math.atan(Math.exp(y)) - PI / 2, x] : null, b: [-PI, PI, -3.13, 3.13],
    txt: 'Cilindro tangente al Ecuador; los paralelos se separan cada vez más para conservar los ángulos. Las líneas de rumbo constante (loxodromias) son rectas: por eso fue la carta náutica por excelencia (G. Mercator, 1569). Exagera enormemente las superficies en latitudes altas y no puede representar los polos.' };
  const c45 = Math.cos(45 * D);
  P.peters = { name: 'Gall-Peters', fam: 'Cilíndrica', prop: ['e', 'Equivalente'],
    fwd: (p, l) => [l * c45, Math.sin(p) / c45], inv: (x, y) => { const s = y * c45; if (Math.abs(s) > 1 || Math.abs(x) > PI * c45) return null; return [Math.asin(s), x / c45]; }, b: [-PI * c45, PI * c45, -1 / c45, 1 / c45],
    txt: 'Cilíndrica equivalente con paralelos estándar a 45°. La publicó J. Gall en 1855 y la popularizó A. Peters en 1973 como alternativa «justa» a Mercator. Conserva las superficies, pero alarga mucho las formas cerca del Ecuador y las aplana en latitudes altas. Los paralelos se aproximan hacia los polos.' };
  P.tm = { name: 'Transversa de Mercator (base de la UTM)', fam: 'Cilíndrica', prop: ['c', 'Conforme'], tm: true,
    fwd: (p, l) => { const B = Math.cos(p) * Math.sin(l); if (Math.abs(B) > 0.986) return null; return [0.5 * Math.log((1 + B) / (1 - B)), Math.atan2(Math.tan(p), Math.cos(l))]; },
    inv: (x, y) => { if (Math.abs(x) > 2.5 || Math.abs(y) > PI) return null; return [Math.asin(Math.sin(y) / Math.cosh(x)), Math.atan2(Math.sinh(x), Math.cos(y))]; }, b: [-2.5, 2.5, -PI, PI],
    txt: 'El cilindro se coloca tangente a un meridiano (el central). La deformación es mínima cerca de él y crece rápidamente al alejarse. La UTM divide la Tierra en 60 husos de 6° y usa un cilindro secante (factor de escala 0,9996 en el meridiano central). La franja resaltada es el huso 30, donde está casi toda la España peninsular.' };
  P.moll = { name: 'Mollweide (homolográfica)', fam: 'Pseudocilíndrica', prop: ['e', 'Equivalente'],
    fwd: (p, l) => { const t = mollTheta(p); return [2 * S2 / PI * l * Math.cos(t), S2 * Math.sin(t)]; },
    inv: (x, y) => { if (Math.abs(y) > S2) return null; const t = Math.asin(y / S2); const l = PI * x / (2 * S2 * Math.cos(t)); if (Math.abs(l) > PI) return null; return [Math.asin((2 * t + Math.sin(2 * t)) / PI), l]; }, b: [-2 * S2, 2 * S2, -S2, S2],
    txt: 'Mundo encerrado en una elipse cuyo Ecuador mide el doble que el meridiano central. Paralelos rectos, meridianos elípticos. Conserva las superficies: adecuada para mapas temáticos mundiales de distribución.' };
  P.sinu = { name: 'Sinusoidal', fam: 'Pseudocilíndrica', prop: ['e', 'Equivalente'],
    fwd: (p, l) => [l * Math.cos(p), p], inv: (x, y) => { if (Math.abs(y) > PI / 2) return null; const c = Math.cos(y); const l = c < 1e-9 ? 0 : x / c; if (Math.abs(l) > PI) return null; return [y, l]; }, b: [-PI, PI, -PI / 2, PI / 2],
    txt: 'Paralelos rectos y equiespaciados, con su longitud real; los meridianos son sinusoides. Equivalente y sin deformación a lo largo del Ecuador y del meridiano central, pero muy distorsionada en los bordes.' };
  // Goode homolosena interrumpida
  const PHT = 40.7366666 * D, YOFF = 0.0528035274542;
  const NL = [[-180, -40, -100], [-40, 180, 30]], SL = [[-180, -100, -160], [-100, -20, -60], [-20, 80, 20], [80, 180, 140]];
  const gF = (p, dl) => { if (Math.abs(p) <= PHT) return [dl * Math.cos(p), p]; const t = mollTheta(p); return [2 * S2 / PI * dl * Math.cos(t), S2 * Math.sin(t) - Math.sign(p) * YOFF]; };
  P.goode = { name: 'Homolosena de Goode (interrumpida)', fam: 'Compleja', prop: ['e', 'Equivalente'], fixed: true,
    fwd: (p, l) => { const L = l / D; const lobes = p >= 0 ? NL : SL; for (const [a, b, c] of lobes) if (L >= a && L <= b) { const q = gF(p, l - c * D); return [q[0] + c * D, q[1]]; } return null; },
    inv: (x, y) => {
      let p; const yt = PHT;
      if (Math.abs(y) <= yt) p = y; else { const yy = y + Math.sign(y) * YOFF; if (Math.abs(yy) > S2) return null; const t = Math.asin(yy / S2); p = Math.asin((2 * t + Math.sin(2 * t)) / PI); }
      const lobes = p >= 0 ? NL : SL;
      for (const [a, b, c] of lobes) {
        const dx = x - c * D; let dl;
        if (Math.abs(p) <= PHT) { const cp = Math.cos(p); dl = cp < 1e-9 ? 0 : dx / cp; }
        else { const t = mollTheta(p); dl = dx * PI / (2 * S2 * Math.cos(t)); }
        const L = (c * D + dl) / D; if (L >= a - 1e-6 && L <= b + 1e-6) return [p, c * D + dl];
      }
      return null;
    }, b: [-PI, PI, -PI / 2, PI / 2],
    txt: 'Combina la sinusoidal (latitudes bajas) y la de Mollweide (altas), unidas a 40° 44′, e interrumpe los océanos para que cada continente quede cerca de un meridiano central propio. Equivalente y con formas continentales bastante fieles: muy usada en atlas para mapas de distribución.' };
  // Lambert cónica conforme
  const f1 = 30 * D, f2 = 60 * D, f0 = 45 * D;
  const n = Math.log(Math.cos(f1) / Math.cos(f2)) / Math.log(Math.tan(PI / 4 + f2 / 2) / Math.tan(PI / 4 + f1 / 2));
  const F = Math.cos(f1) * Math.pow(Math.tan(PI / 4 + f1 / 2), n) / n, r0 = F / Math.pow(Math.tan(PI / 4 + f0 / 2), n);
  P.lcc = { name: 'Cónica conforme de Lambert', fam: 'Cónica', prop: ['c', 'Conforme'], cone: true,
    fwd: (p, l) => { if (p < -20 * D) return null; const r = F / Math.pow(Math.tan(PI / 4 + p / 2), n); return [r * Math.sin(n * l), r0 - r * Math.cos(n * l)]; },
    inv: (x, y) => { const r = Math.hypot(x, r0 - y); const th = Math.atan2(x, r0 - y); const l = th / n; if (Math.abs(l) > PI) return null; const p = 2 * Math.atan(Math.pow(F / r, 1 / n)) - PI / 2; if (p < -20 * D) return null; return [p, l]; },
    b: null, txt: 'Cono secante a la esfera en dos paralelos (aquí 30° N y 60° N), sobre los que no hay deformación. Paralelos en arcos concéntricos y meridianos radiales. Ideal para territorios extensos en longitud y de latitud media: Europa, EE. UU. o la cartografía aeronáutica. Solo se representa hasta 20° S.' };
  // acimutales (aspecto y punto de vista configurables)
  const AZ = { equid: ['Equidistante', ['q', 'Equidistante desde el centro'], (c) => c, (r) => r, PI],
    ortho: ['Ortográfica (punto de vista en el infinito)', ['n', 'Ni conforme ni equivalente'], (c) => Math.sin(c), (r) => r > 1 ? NaN : Math.asin(r), PI / 2],
    stereo: ['Estereográfica (punto de vista en las antípodas)', ['c', 'Conforme'], (c) => 2 * Math.tan(c / 2), (r) => 2 * Math.atan(r / 2), 130 * D],
    gnomo: ['Gnomónica (punto de vista en el centro de la Tierra)', ['n', 'Círculos máximos como rectas'], (c) => Math.tan(c), (r) => Math.atan(r), 65 * D],
    laea: ['Equivalente de Lambert', ['e', 'Equivalente'], (c) => 2 * Math.sin(c / 2), (r) => r > 2 ? NaN : 2 * Math.asin(r / 2), PI] };
  P.azi = { name: 'Acimutal', fam: 'Acimutal', azi: true, prop: null, b: null, txt: '' };
  P.aziMake = (type, lat0) => {
    const [nm, prop, rho, irho, cmax] = AZ[type]; const p0 = lat0 * D, s0 = Math.sin(p0), c0 = Math.cos(p0);
    const rmax = rho(Math.min(cmax, PI - 1e-6));
    return Object.assign({}, P.azi, { name: 'Acimutal ' + nm.charAt(0).toLowerCase() + nm.slice(1), prop, b: [-rmax, rmax, -rmax, rmax],
      fwd: (p, l) => { const cc = s0 * Math.sin(p) + c0 * Math.cos(p) * Math.cos(l); const c = Math.acos(H.clamp(cc, -1, 1)); if (c > cmax) return null; const k = c < 1e-9 ? 1 : rho(c) / Math.sin(c); return [k * Math.cos(p) * Math.sin(l), k * (c0 * Math.sin(p) - s0 * Math.cos(p) * Math.cos(l))]; },
      inv: (x, y) => { const r = Math.hypot(x, y); if (r > rmax) return null; const c = irho(r); if (!isFinite(c) || c > cmax) return null; if (r < 1e-12) return [p0, 0]; const sc = Math.sin(c), cc = Math.cos(c); return [Math.asin(H.clamp(cc * s0 + y * sc * c0 / r, -1, 1)), Math.atan2(x * sc, r * c0 * cc - y * s0 * sc)]; },
      txt: { equid: 'Proyección sobre un plano tangente. Las distancias y direcciones desde el punto central son verdaderas: útil para radiocomunicaciones o rutas aéreas desde un punto (es el emblema de la ONU, en aspecto polar).', ortho: 'Perspectiva desde el infinito: la Tierra tal como se ve desde muy lejos, como una fotografía desde el espacio. Solo muestra un hemisferio y comprime mucho los bordes.', stereo: 'Perspectiva desde el punto diametralmente opuesto al de tangencia. Es conforme: conserva los ángulos y transforma círculos en círculos. Muy usada en mapas polares y en cristalografía.', gnomo: 'Perspectiva desde el centro de la Tierra. Todos los círculos máximos (las rutas más cortas) aparecen como rectas: se usa para trazar ortodromias en navegación. La deformación crece muy deprisa: no puede mostrar ni un hemisferio.', laea: 'Conserva las superficies alrededor de un centro. La Unión Europea la usa (centrada en 52° N, 10° E) para sus estadísticas espaciales (proyección ETRS89-LAEA).' }[type] });
  };
  P.wrap = wrap;
  return P;
})();

H.tab({
  id: 'proyecciones', nav: 'Proyecciones', title: 'Proyecciones cartográficas',
  init(el) {
    el.append(H.intro('Mapa · apartado 3.1', 'Las proyecciones: de la esfera al plano',
      'No es posible aplanar una esfera sin deformarla. Cada proyección elige qué conserva: los ángulos (conformes), las superficies (equivalentes) o ciertas distancias (equidistantes). Las indicatrices de Tissot, círculos iguales sobre la esfera, muestran cómo y cuánto deforma cada una.',
      'Manual: 3.1<br>Figuras 1.11 a 1.16'));
    const PR = H.PROJ;
    const s = { key: 'merc', lon0: 0, aziType: 'equid', aziLat: 90, tissot: true, grid: true, shape: 'Groenlandia', truesize: false, at: null, hover: null };
    const proj = () => { const p = s.key === 'azi' ? PR.aziMake(s.aziType, s.aziLat) : PR[s.key]; return p; };
    const center = () => s.key === 'goode' ? 0 : s.key === 'tm' ? s.tmLon ?? -3 : s.lon0;

    const cv = H.h('canvas'); const tip = H.h('div', { class: 'tooltip' });
    let base = null, baseKey = '', geom = null;
    const bounds = (p) => {
      if (p.b) return p.b;
      let xa = 1e9, xb = -1e9, ya = 1e9, yb = -1e9;
      for (let la = -20; la <= 90; la += 2) for (let lo = -180; lo <= 180; lo += 3) { const q = p.fwd(la * H.D2R, lo * H.D2R); if (!q) continue; xa = Math.min(xa, q[0]); xb = Math.max(xb, q[0]); ya = Math.min(ya, q[1]); yb = Math.max(yb, q[1]); }
      return [xa, xb, ya, yb];
    };
    const cs = H.autoCanvas(cv, (w) => { const p = proj(), b = bounds(p); return H.clamp(w * (b[3] - b[2]) / (b[1] - b[0]) + 16, 260, Math.min(640, w * 1.05)); }, (ctx, w, h) => {
      const p = proj(), b = bounds(p), l0 = center() * H.D2R;
      const sc = Math.min((w - 16) / (b[1] - b[0]), (h - 16) / (b[3] - b[2]));
      const ox = w / 2 - (b[0] + b[1]) / 2 * sc, oy = h / 2 + (b[2] + b[3]) / 2 * sc;
      geom = { p, sc, ox, oy, l0 };
      const key = [s.key, s.aziType, s.aziLat, center(), w, h].join('|');
      if (key !== baseKey) {
        const img = ctx.createImageData(w, h);
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
          const x = (i + 0.5 - ox) / sc, y = (oy - j - 0.5) / sc; const ll = p.inv(x, y); const k = (j * w + i) * 4;
          if (!ll) { img.data[k + 3] = 0; continue; }
          const c = H.surface(ll[0] * H.R2D, PR.wrap(ll[1] + l0) * H.R2D);
          img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
        }
        base = document.createElement('canvas'); base.width = w; base.height = h; base.getContext('2d').putImageData(img, 0, 0); baseKey = key;
      }
      ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, w, h); ctx.drawImage(base, 0, 0, w, h);

      ['insolacion', 'La Tierra pasa por el perihelio (máxima proximidad al Sol)…', ['A comienzos de enero', 'En el solsticio de junio', 'A comienzos de julio', 'En el equinoccio de marzo'], 0, 'Entre el 2 y el 5 de enero, en pleno invierno boreal: la distancia no explica las estaciones.'],
      ['coordenadas', 'La latitud de un punto puede tomar valores…', ['De 0° a 180° E u O', 'De 0° a 90° N o S', 'De 0° a 360°', 'De 0° a 66° 34′'], 1, 'La latitud se mide desde el Ecuador (0°) hasta los polos (90° N o S).'],
      ['coordenadas', 'Todos los puntos de un mismo paralelo tienen igual…', ['Longitud', 'Latitud', 'Hora solar', 'Altitud'], 1, 'Un paralelo une puntos de igual latitud; un meridiano, puntos de igual longitud y, por tanto, igual hora solar.'],
      ['coordenadas', '¿Cuánto mide aproximadamente un grado de un paralelo en el Ecuador?', ['55,8 km', '96,5 km', '111,3 km', '1.670 km'], 2, '111,32 km. Se acorta con el coseno de la latitud hasta 0 en los polos.'],
      ['hora', 'Un lugar situado a 30° E de Greenwich tiene, respecto a Greenwich, una hora solar…', ['2 horas más temprana', '2 horas más tardía', '30 minutos más tardía', 'Igual'], 1, '30° / 15° por hora = 2 h. Hacia el este es más tarde.'],
      ['hora', '¿Qué hora oficial tiene la España peninsular en invierno?', ['UTC+0', 'UTC+1', 'UTC+2', 'UTC−1'], 1, 'UTC+1 desde 1940, aunque geográficamente está casi entera en el huso 0. En verano usa UTC+2.'],
      ['hora', 'La línea internacional de cambio de fecha sigue aproximadamente el meridiano…', ['0°', '90° E', '180°', '90° O'], 2, 'Sigue el meridiano 180° con quiebros acordados por los Estados del Pacífico.'],
      ['coriolis', 'El efecto de Coriolis desvía los cuerpos en movimiento en el hemisferio sur…', ['Hacia la derecha', 'Hacia la izquierda', 'Hacia el Ecuador', 'No los desvía'], 1, 'A la izquierda en el hemisferio sur y a la derecha en el norte.'],
      ['estaciones', '¿Cuál es el valor actual de la inclinación del eje terrestre respecto a la perpendicular al plano de la eclíptica?', ['21° 30′', '23° 26′', '24° 30′', '66° 34′'], 1, '23° 26′ (23,44°). 66° 34′ es el ángulo entre el eje y el plano de la órbita, y la latitud de los círculos polares.'],
      ['estaciones', 'En los equinoccios, el Sol está en la vertical de…', ['El trópico de Cáncer', 'El Ecuador', 'El trópico de Capricornio', 'Los polos'], 1, 'La declinación es 0° y el círculo de iluminación pasa por los polos.'],
      ['estaciones', 'En el solsticio de diciembre, ¿qué ocurre en el círculo polar antártico?', ['Noche de 24 horas', 'Día de 24 horas', 'Día y noche de 12 horas', 'El Sol está en el cénit'], 1, 'Es verano austral: al sur del círculo polar antártico el Sol no se pone.'],
      ['estaciones', 'La zona intertropical se caracteriza porque…', ['Hay seis meses de día y seis de noche', 'El Sol llega a la vertical al menos una vez al año', 'Las estaciones térmicas son muy marcadas', 'Los rayos llegan siempre muy oblicuos'], 1, 'Entre los trópicos el Sol pasa por el cénit (dos veces al año, una en los propios trópicos).'],
      ['proyecciones', 'Una proyección que conserva las superficies se denomina…', ['Conforme', 'Equivalente', 'Equidistante', 'Gnomónica'], 1, 'Equivalente. Las conformes conservan los ángulos y las equidistantes ciertas distancias.'],
      ['proyecciones', 'La proyección UTM, usada en el Mapa Topográfico Nacional, es…', ['Cónica conforme', 'Cilíndrica transversa conforme', 'Acimutal equivalente', 'Pseudocilíndrica equivalente'], 1, 'Transversa de Mercator: cilindro tangente (secante, en la práctica) a un meridiano, en husos de 6°.'],
      ['proyecciones', 'En la proyección de Mercator, Groenlandia aparece aproximadamente tan grande como África porque…', ['Groenlandia es casi tan grande como África', 'La proyección exagera las superficies en latitudes altas', 'Es una proyección equivalente', 'Se usa una escala distinta para cada continente'], 1, 'Mercator es conforme y amplía las superficies con la latitud. África es unas 14 veces mayor que Groenlandia.'],
      ['escala', 'En un mapa a escala 1:25.000, 4 cm representan…', ['100 m', '1 km', '10 km', '25 km'], 1, '4 × 25.000 = 100.000 cm = 1 km.'],
      ['escala', 'Un mapa 1:10.000 frente a uno 1:100.000 es de…', ['Menor escala y más detalle', 'Mayor escala y más detalle', 'Mayor escala y menos detalle', 'La misma escala'], 1, 'Menor denominador = mayor escala = más detalle de un territorio más pequeño.'],
      ['escala', 'Si en un mapa 1:50.000 una finca mide 2 cm², su superficie real es…', ['10 ha', '50 ha', '100 ha', '500 ha'], 1, '2 cm² × (500 m/cm)² = 2 × 250.000 m² = 500.000 m² = 50 ha.'],
      ['relieve', 'Las curvas de nivel también se llaman…', ['Isobaras', 'Isotermas', 'Isohipsas', 'Isoyetas'], 2, 'Isohipsas: de iso (igual) e hypsos (altura).'],
      ['relieve', 'En mapas de escala muy pequeña, el relieve suele representarse mediante…', ['Curvas de nivel cada 5 m', 'Tintas hipsométricas', 'Fotografías aéreas', 'Cotas aisladas solamente'], 1, 'Con escalas pequeñas las curvas se apelotonan; se colorean los intervalos de altitud (tintas hipsométricas), a menudo con sombreado.'],
      ['relieve', 'Un desnivel de 100 m en 500 m de distancia horizontal supone una pendiente de…', ['5 %', '20 %', '50 %', '500 %'], 1, '100 / 500 × 100 = 20 %.'],
    ];
    const box = H.h('div');
    let qs = [], answers = [];
    const build = () => {
      qs = [...BANK].sort(() => Math.random() - 0.5).slice(0, 20).map(([tab, q, opts, a, ex]) => { const idx = opts.map((_, i) => i).sort(() => Math.random() - 0.5); return { tab, q, opts: idx.map((i) => opts[i]), a: idx.indexOf(a), ex }; });
      answers = new Array(qs.length).fill(null);
      box.innerHTML = '';
      const prog = H.h('p', { class: 'small' }, `0 de ${qs.length} respondidas`);
      const list = H.h('div', { class: 'card' });
      qs.forEach((q, i) => {
        const opts = H.h('div', { class: 'opts' });
        q.opts.forEach((o, j) => { const b = H.h('button', { class: 'opt', type: 'button', html: `<span class="l">${'abcd'[j]})</span><span>${o}</span>` }); b.onclick = () => { if (box.dataset.done) return; answers[i] = j; H.$$('.opt', opts).forEach((x, k) => { x.style.borderColor = k === j ? 'var(--ink)' : ''; x.style.background = k === j ? 'var(--soft)' : ''; }); prog.textContent = `${answers.filter((x) => x !== null).length} de ${qs.length} respondidas`; }; opts.append(b); });
        list.append(H.h('div', { class: 'q' }, H.h('div', { class: 'qt', html: `<span class="n">${i + 1}.</span>${q.q}` }), opts, H.h('div', { class: 'fb' })));
      });
      const corr = H.h('button', { class: 'btn acc', type: 'button' }, 'Corregir');
      const again = H.h('button', { class: 'btn ghost', type: 'button', style: { display: 'none' } }, 'Nuevo cuestionario');
      const result = H.h('div');
      corr.onclick = () => {
        const pend = answers.filter((x) => x === null).length;
        if (pend && !confirm(`Te faltan ${pend} preguntas. ¿Corregir de todos modos?`)) return;
        box.dataset.done = '1'; let ok = 0; const weak = {};
        H.$$('.q', list).forEach((qe, i) => {
          const q = qs[i], good = answers[i] === q.a; if (good) ok++; else weak[q.tab] = (weak[q.tab] || 0) + 1;
          H.$$('.opt', qe).forEach((x, k) => { x.disabled = true; x.style.background = ''; x.style.borderColor = ''; if (k === q.a) x.classList.add('ok'); else if (k === answers[i]) x.classList.add('ko'); });
          const t = H.TABS.find((x) => x.id === q.tab);
          const fb = H.$('.fb', qe); fb.className = 'fb show ' + (good ? 'ok' : 'ko'); fb.innerHTML = `<b>${good ? 'Correcto.' : answers[i] === null ? 'Sin responder.' : 'No es correcto.'}</b>${q.ex} <a href="#${q.tab}">Repasar en «${t.nav}» →</a>`;
        });
        const nota = ok / qs.length * 10;
        const wk = Object.entries(weak).sort((a, b) => b[1] - a[1]).map(([k, n]) => { const t = H.TABS.find((x) => x.id === k); return `<a href="#${k}">${t.nav}</a> (${n})`; });
        result.innerHTML = `<div class="result-box"><div class="big">${H.f(nota, 1)}</div><div>${ok} aciertos de ${qs.length}</div>${wk.length ? `<p class="small">Conviene repasar: ${wk.join(' · ')}</p>` : '<p class="small">Ningún fallo. Tema dominado.</p>'}</div>`;
        corr.style.display = 'none'; again.style.display = ''; result.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      again.onclick = () => { delete box.dataset.done; build(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      box.append(prog, list, result, H.h('div', { class: 'exam-nav' }, corr, again));
    };
    build();
    el.append(box);
  },
});

H.start();
