<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tema 2 · La temperatura</title>
<meta name="description" content="Interactivos del Tema 2 de Geografía General I (Geografía Física, UNED): la atmósfera, la insolación terrestre y la temperatura.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23cfe0ea' stroke='%231c2836' stroke-width='2'/%3E%3Cpath d='M2 16h28M16 2c-6 7-6 21 0 28M16 2c6 7 6 21 0 28' fill='none' stroke='%231c2836' stroke-width='1.5'/%3E%3C/svg%3E">
<style>:root{
  --paper:#f6f3ea; --card:#fffdf8; --ink:#1c2836; --muted:#5a6878; --line:#ddd5c3; --soft:#efe9da;
  --accent:#b4531d; --accent-soft:#f6e3d6; --blue:#1f6f8b; --blue-soft:#dcebf1;
  --ok:#2d7a4c; --ok-soft:#e1f1e6; --bad:#b0393a; --bad-soft:#f7e1df; --warn:#8a6512; --warn-soft:#f6edd2;
  --land:#e4d3a8; --ocean:#cfe0ea;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em}
h2{font-size:1.7rem} h3{font-size:1.2rem;margin-top:.2em} h4{font-size:1.02rem}
p{margin:.4em 0 .8em}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
small,.small{font-size:.86rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header.top{background:var(--ink);color:#f3efe4;padding:14px 20px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand{display:flex;flex-direction:column;flex:1;min-width:240px}
.brand .kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#d9b48f}
.brand .title{font-family:var(--serif);font-size:1.22rem;line-height:1.2}
.place-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 6px 5px 14px;cursor:pointer;color:#f3efe4;max-width:100%}
.place-pill:hover{background:rgba(255,255,255,.14)}
.place-pill .lbl{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.place-pill b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.place-pill .chg{background:#d9b48f;color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:12px auto 0;scrollbar-width:thin}
nav.tabs .grp{display:flex;flex-direction:column;flex:none}
nav.tabs .grp-name{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#d9b48f;padding:0 10px;opacity:.85}
nav.tabs .grp-btns{display:flex;gap:2px}
nav.tabs button{background:transparent;border:0;color:#cfd6df;padding:7px 12px 10px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-size:.93rem}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);font-weight:600}
nav.tabs .sep{width:1px;background:rgba(255,255,255,.15);margin:14px 6px 6px}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.intro{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.intro .lead{color:var(--muted);max-width:820px;margin:0}
.intro .ref{font-size:.8rem;color:var(--muted);text-align:right;border-left:3px solid var(--accent);padding-left:10px}
.intro .eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.card>h3:first-child{margin-top:0}
.card .sub{color:var(--muted);font-size:.92rem;margin-top:-.2em}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid2.even{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2,.grid2.even,.grid3{grid-template-columns:1fr}.intro{grid-template-columns:1fr}.intro .ref{text-align:left}}

.viz{position:relative;width:100%}
.viz canvas,.viz svg{display:block;width:100%;height:auto;border-radius:8px}
.viz.framed canvas,.viz.framed svg{border:1px solid var(--line);background:#fff}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.hint::before{content:"↳ ";color:var(--accent)}

/* controles */
.ctrl{margin:0 0 12px}
.ctrl label,.ctrl .lab{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;margin-bottom:3px}
.ctrl label output,.ctrl .lab output{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:.86rem}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=text],input[type=date],select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:.86rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:#2c3e53}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;margin-right:14px;cursor:pointer}
.chk input{accent-color:var(--accent)}

/* lecturas */
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ro{background:var(--soft);border-radius:8px;padding:8px 10px}
.ro .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ro .v{font-family:var(--serif);font-size:1.25rem;font-variant-numeric:tabular-nums}
.ro .v small{font-family:var(--sans)}
.ro.hl{background:var(--accent-soft)}
.ro.bl{background:var(--blue-soft)}
.formula{font-family:var(--serif);font-style:italic;background:var(--soft);padding:6px 10px;border-radius:6px;display:inline-block}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.t td.bad{color:var(--bad)} table.t td.good{color:var(--ok);font-weight:600}

/* notas de corrección */
.fix{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.fix .fh{font-weight:700;color:var(--warn);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.fix ul{margin:.2em 0;padding-left:1.2em}
.fix s{color:var(--bad);text-decoration-thickness:1.5px}
.info{border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}

/* autoevaluación */
.selfcheck{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-top:8px}
.selfcheck>h3{display:flex;align-items:center;gap:10px}
.selfcheck>h3 .score{margin-left:auto;font-family:var(--sans);font-size:.85rem;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 12px}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:8px}
.q .qt .n{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:.93rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .l{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;font-size:.9rem;padding:8px 11px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
details.open-q{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:#fff}
details.open-q summary{cursor:pointer;font-weight:600}
details.open-q .ans{margin-top:8px;font-size:.93rem;border-top:1px dashed var(--line);padding-top:8px}

/* buscador municipio */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,40,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-top:0}
.sugg{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;background:#fff}
.sugg li{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;gap:10px}
.sugg li:last-child{border-bottom:0}
.sugg li:hover,.sugg li.sel{background:var(--accent-soft)}
.sugg li small{white-space:nowrap}
.modal .alt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
.modal .alt>div{flex:1;min-width:100px}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr);gap:18px;align-items:start;margin-bottom:18px}
.toc3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.cmap svg{width:100%;height:auto}
.cmap .node{cursor:pointer}
.cmap .node rect{fill:#fff;stroke:var(--ink);stroke-width:1.2;transition:fill .15s}
.cmap .node:hover rect{fill:var(--accent-soft)}
.cmap .node text{font-family:var(--sans);font-size:13.5px;fill:var(--ink);pointer-events:none}
.cmap .node.root rect{fill:var(--ink)} .cmap .node.root text{fill:#fff;font-weight:700}
.cmap .node.hub rect{fill:var(--soft)}
.cmap .node.dis{cursor:default}.cmap .node.dis rect,.cmap .node.dis:hover rect{fill:#f3f0e8;stroke:#b7ae9c;stroke-dasharray:4 3}.cmap .node.dis text{fill:#8a8272}
.cmap .node.ext rect{stroke:var(--blue);stroke-dasharray:5 3}
.cmap .node text.tag{font-size:9.5px;fill:var(--blue);font-weight:700;letter-spacing:.04em}
.tlegend{margin-top:6px}
.wide-svg{overflow-x:auto}
@media (max-width:700px){.wide-svg svg{min-width:640px}}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}
.chipbar .chip{font-family:var(--sans);font-size:.82rem;padding:4px 10px}
.flowtable td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmap .edge{stroke:#8a96a3;stroke-width:1.2;fill:none}
.cmap .tag{font-size:10px;fill:var(--accent);font-weight:700;letter-spacing:.04em}
.toc{display:grid;gap:8px}
.toc a{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.toc a:hover{border-color:var(--accent)}
.toc a .i{font-family:var(--serif);font-size:1.3rem;color:var(--accent);text-align:center}
.toc a .d{font-size:.83rem;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;font-size:.8rem;color:var(--muted)}

.tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.8rem;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:5;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.badge.c{background:#e2ecf8;color:#24538a}.badge.e{background:#e3f1e3;color:#2d6a3a}.badge.q{background:#f6e7d6;color:#8a4b14}.badge.n{background:#eee;color:#666}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.kbd{font-family:var(--mono);font-size:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.clock{font-family:var(--serif);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.ko{background:var(--bad-soft);color:var(--bad)}
.sortlist{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:#fff}
.chip{border:1px solid var(--ink);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;font-family:var(--mono);font-size:.88rem}
.chip.sel{background:var(--ink);color:#fff}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)} .chip.ko{border-color:var(--bad);background:var(--bad-soft)}
.exam-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.result-box{text-align:center;padding:20px;border-radius:12px;background:var(--soft);margin-bottom:12px}
.result-box .big{font-family:var(--serif);font-size:3rem;line-height:1}
@media print{header.top,nav.tabs{display:none}section.tab{display:block!important}}
.brand .kicker .home-link{color:#f3efe4;text-decoration:none;font-weight:700;border-bottom:1px solid rgba(243,239,228,.4)}
.brand .kicker .home-link:hover{border-bottom-color:#f3efe4}
@media (max-width:700px){header.top{position:static}.brand .kicker{font-size:0;letter-spacing:0}.brand .kicker .home-link{font-size:.75rem;letter-spacing:.1em}.brand .title{font-size:1.05rem}main{padding:16px 12px 50px}h2{font-size:1.4rem}.card{padding:14px 12px}}
</style>
</head>

    const order = ['España', 'Ecuatorial', 'Ecuatorial de montaña', 'Tropical', 'Desértico / árido', 'Mediterráneo', 'Subtropical húmedo', 'Oceánico', 'Subpolar oceánico', 'Continental', 'Subártico', 'Polar'];

    std: { name: 'Latitudes medias (atmósfera estándar)', o3: 22, pts: [[0, 288.15], [11.02, 216.65], [20.06, 216.65], [32.16, 228.65], [47.35, 270.65], [51.41, 270.65], [71.8, 214.65], ...UP] },
    tro: { name: 'Trópicos', o3: 26, pts: [[0, 299.7], [17, 195], [20, 203], [32, 230], [47, 270], [51, 270], [71.8, 215], ...UP] },
    saw: { name: 'Subártico, invierno', o3: 18, pts: [[0, 257.2], [1, 259.1], [8.5, 218], [25, 213], [47, 260], [52, 260], [71.8, 213], ...UP] },

      while (j < pts.length - 2 && zz > pts[j + 1][0]) j++;
      const [z0, t0] = pts[j], [z1, t1] = pts[j + 1];
      Tk[i] = t0 + (t1 - t0) * (zz - z0) / (z1 - z0);
      if (i === 0) P[i] = 101325; else { const tm = (Tk[i] + Tk[i - 1]) / 2; P[i] = P[i - 1] * Math.exp(-g0 * dz * 1000 / (Rd * tm)); }
    }
    // estratopausa: máximo entre 40 y 60 km; mesopausa: mínimo entre 75 y 95 km
    let trop = 0, strat = 0, meso = 0;
    // tropopausa (criterio OMM simplificado): primer nivel por encima de 5 km con gradiente menor de 2 °C/km
    for (let i = Math.round(5 / dz); i < N - 1; i++) if ((Tk[i] - Tk[i + 1]) / dz < 2) { trop = z[i]; break; }
    let mx = -1; for (let i = Math.round(40 / dz); i <= Math.round(60 / dz); i++) if (Tk[i] > mx) { mx = Tk[i]; strat = z[i]; }
    let mn = 1e9; for (let i = Math.round(75 / dz); i <= Math.round(95 / dz); i++) if (Tk[i] < mn) { mn = Tk[i]; meso = z[i]; }
    // la estratopausa y la mesopausa son mesetas: se toma su punto medio
    const plateau = (z0, test) => { let a = z0, b = z0; while (a > 0 && test(Math.round((a - dz) / dz))) a -= dz; while (b < 120 && test(Math.round((b + dz) / dz))) b += dz; return (a + b) / 2; };
    strat = plateau(strat, (i) => Math.abs(Tk[i] - mx) < 0.01);
    meso = plateau(meso, (i) => Math.abs(Tk[i] - mn) < 0.01);
    return (cache[key] = { z, T: Tk, P, dz, trop, strat, meso });
  };
  T.atmAt = (key, zkm) => {
    const t = T.atmTable(key), i = Math.max(0, Math.min(t.z.length - 1, Math.round(zkm / t.dz)));
    const Tk = t.T[i], P = t.P[i];
    return { T: Tk, P, rho: P / (Rd * Tk), mass: 1 - P / 101325, trop: t.trop, strat: t.strat, meso: t.meso };
  };
  T.layerName = (key, zkm) => {
    const t = T.atmTable(key);
    if (zkm < t.trop) return 'Troposfera'; if (zkm < t.strat) return 'Estratosfera'; if (zkm < t.meso) return 'Mesosfera'; return 'Termosfera';
  };

  /* ---------- humedad ---------- */
  /* Presión de vapor de saturación (hPa), fórmula de Magnus (OMM, 2018): sobre agua (T ≥ 0) y sobre hielo (T < 0) */
  T.es = (t) => (t >= 0 ? 6.112 * Math.exp(17.62 * t / (243.12 + t)) : 6.112 * Math.exp(22.46 * t / (272.62 + t)));
  /* Humedad absoluta de saturación (g/m³) */
  T.rhoSat = (t) => T.es(t) * 100 / (461.5 * (t + 273.15)) * 1000;
  T.rhoV = (e, t) => e * 100 / (461.5 * (t + 273.15)) * 1000;
  /* temperatura de rocío para una humedad absoluta dada (g/m³), por bisección */
  T.dewPointRho = (rho) => { let a = -60, b = 50; for (let i = 0; i < 60; i++) { const m = (a + b) / 2; if (T.rhoSat(m) > rho) b = m; else a = m; } return (a + b) / 2; };
  T.Rv = 461.5; T.Rd = Rd;

  /* ---------- radiación ---------- */
  T.SIGMA = 5.670374e-8;
  T.planck = (lamUm, Tk) => { const l = lamUm * 1e-6, h = 6.62607015e-34, c = 2.99792458e8, k = 1.380649e-23; return 2 * h * c * c / (l ** 5) / (Math.exp(h * c / (l * k * Tk)) - 1); };
  T.bandFraction = (Tk, a, b) => { // fracción de la emisión de un cuerpo negro entre a y b µm
    const f = (x) => T.planck(x, Tk); let s = 0, tot = 0;
    for (let x = 0.05; x < 1000; x *= 1.002) { const dx = x * 0.002, v = f(x) * dx; tot += v; if (x >= a && x < b) s += v; }
    return s / tot;
  };
  T.LANGLEY = 0.48426; // 1 cal/cm²·día = 0,484 W/m²

  /* ---------- ciclo diario (modelo de Parton y Logan, 1981, adaptado) ---------- */
  /* t: hora solar; rise/set: orto y ocaso en hora solar; lag: desfase de la máxima respecto al mediodía (h) */
  T.daily = (t, tmin, tmax, rise, set, lag = 2.5, b = 2.2) => {
    const D = set - rise;
    if (D >= 23.9 || D <= 0.1) { // día o noche polar: onda simple
      const amp = (tmax - tmin) / 2; return (tmax + tmin) / 2 + amp * Math.cos(2 * Math.PI * (t - 12 - lag) / 24);
    }
    const day = (tt) => { const m = tt - rise; const per = 2 * (12 + lag - rise); return tmin + (tmax - tmin) * Math.sin(Math.PI * m / per); };
    const Tset = day(set), N = 24 - D;
    const night = (n) => tmin + (Tset - tmin) * (Math.exp(-b * n / N) - Math.exp(-b)) / (1 - Math.exp(-b));
    t = ((t % 24) + 24) % 24;
    if (t >= rise && t <= set) return day(t);
    const n = t > set ? t - set : t + 24 - set;
    return night(n);
  };
  /* radiación global aproximada con cielo despejado (W/m²): Meinel con masa de aire de Kasten y Young */
  T.clearSky = (lat, decl, tSolar) => {
    const H0 = (tSolar - 12) * 15 * D2R, p = lat * D2R, d = decl * D2R;
    const cz = Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H0);
    if (cz <= 0) return 0;
    const z = Math.acos(cz) / D2R, am = 1 / (cz + 0.50572 * Math.pow(96.07995 - z, -1.6364));
    return 1361 * 1.1 * cz * Math.pow(0.7, Math.pow(am, 0.678)) ;
  };

  /* ---------- color de temperatura ---------- */
  const TS = [[-50, [44, 27, 107]], [-35, [43, 78, 162]], [-20, [63, 143, 197]], [-8, [140, 200, 214]], [0, [226, 238, 226]], [8, [236, 232, 176]], [16, [246, 205, 118]], [23, [240, 150, 70]], [30, [200, 70, 45]], [38, [110, 15, 26]]];
  T.tColor = (t) => {
    if (t <= TS[0][0]) return TS[0][1]; if (t >= TS[TS.length - 1][0]) return TS[TS.length - 1][1];
    for (let i = 1; i < TS.length; i++) if (t <= TS[i][0]) { const u = (t - TS[i - 1][0]) / (TS[i][0] - TS[i - 1][0]); return H.mix(TS[i - 1][1], TS[i][1], u); }
  };
  T.tCss = (t) => `rgb(${T.tColor(t).map(Math.round).join(',')})`;
  T.legendBar = (min, max, step, w = 300) => {
    const c = H.h('canvas', { width: w, height: 12, style: { width: '100%', maxWidth: w + 'px', height: '12px', borderRadius: '3px', display: 'block' } });
    const x = c.getContext('2d'); for (let i = 0; i < w; i++) { x.fillStyle = T.tCss(min + (max - min) * i / (w - 1)); x.fillRect(i, 0, 1, 12); }
    const lab = H.h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: '.75rem', color: 'var(--muted)', maxWidth: w + 'px' } });
    for (let v = min; v <= max + 1e-9; v += step) lab.append(H.h('span', {}, H.f(v) + '°'));
    return H.h('div', { class: 'tlegend' }, c, lab);
  };

  /* ---------- formato ---------- */
  T.fT = (v, d = 1) => (v == null || !isFinite(v) ? '—' : H.f(v, d).replace('-', '−') + ' °C');
  T.fNum = (v, d = 1) => (v == null || !isFinite(v) ? '—' : H.f(v, d).replace('-', '−'));
  return T;
})();

    cool.onclick = () => { clearInterval(anim); anim = setInterval(() => { s.t = Math.round((s.t - 0.25) * 4) / 4; if (s.t <= TMIN || s.t <= T2.dewPointRho(s.rho) - 4) { clearInterval(anim); } tS.set(s.t); upd(); }, 40); };
    const presets = H.h('div', { class: 'chipbar' });
    [['Ejemplo del manual: 20 °C y 12 g/m³', 20, 12], ['Desierto: 35 °C y 5 g/m³', 35, 5], ['Ecuador: 27 °C y 22 g/m³', 27, 22], ['Invierno: −5 °C y 2,5 g/m³', -5, 2.5]].forEach(([l, t, r]) => { const b = H.h('button', { class: 'chip', type: 'button' }, l); b.onclick = () => { clearInterval(anim); s.t = t; s.rho = r; tS.set(t); rS.set(r); upd(); }; presets.append(b); });

    };
    H.drag(cv, { down: (e) => setPt(e), move: (e) => setPt(e) });
    const setPt = (e) => { clearInterval(anim); const [x, y] = cs.pos(e); const t = TMIN + (x - P.l) / (cs.w - P.l - P.r) * (TMAX - TMIN), r = (cs.h - P.b - y) / (cs.h - P.t - P.b) * RMAX; s.t = H.clamp(Math.round(t * 2) / 2, TMIN, TMAX); s.rho = H.clamp(Math.round(r * 10) / 10, 0.1, 40); tS.set(s.t); rS.set(s.rho); upd(); };
    cv.style.cursor = 'crosshair';
    el.append(H.h('div', { class: 'card' }, H.h('h3', {}, 'Laboratorio del aire húmedo'),
      H.h('p', { class: 'sub' }, 'La curva azul es la fig. 2.3: la masa máxima de vapor por metro cúbico a cada temperatura (sobre hielo por debajo de 0 °C). El punto naranja es una masa de aire. Desplázalo, o pulsa «Enfriar»: al cruzar la curva se satura y el exceso condensa.'),

        H.h('div', {}, tS, rS, H.h('div', { class: 'row', style: { justifyContent: 'flex-start', margin: '4px 0 10px' } }, H.h('span', { style: { flex: 'none' } }, cool)), presets,
          H.h('div', { class: 'readouts', style: { marginTop: '12px' } }, ro.t, ro.ha, ro.hs, ro.hr, ro.dew, ro.c),
          H.h('p', { class: 'small', html: '<span class="formula">HR = H<sub>absoluta</sub> / H<sub>saturación</sub> × 100</span> &nbsp; Saturación calculada con la fórmula de Magnus (OMM).' })))));
    upd();

    /* ejercicio 1 del manual */
    const ex1 = H.h('div', { class: 'card', style: { background: 'var(--soft)' } });

    ex1.append(H.h('h4', {}, 'Ejercicio de autoevaluación 1 del manual'),
      H.h('p', {}, '¿Qué masa de aire tiene mayor humedad relativa: A, con 6,5 g/m³ a 10 °C, o B, con 10 g/m³ a 20 °C?'),

      H.openQ('Ver la solución', `A: 6,5 / ${H.f(T2.rhoSat(10), 1)} × 100 = <b>${H.f(6.5 / T2.rhoSat(10) * 100, 0)} %</b>. B: 10 / ${H.f(T2.rhoSat(20), 1)} × 100 = <b>${H.f(10 / T2.rhoSat(20) * 100, 0)} %</b>. Tiene mayor humedad relativa <b>A</b>, aunque contiene menos vapor: lo que cuenta es lo cerca que está de la saturación a su temperatura. Además, A se saturaría al enfriarse hasta ${H.f(T2.dewPointRho(6.5), 1)} °C y B hasta ${H.f(T2.dewPointRho(10), 1)} °C.`));
    el.append(ex1);

    /* ---------- B · unidades ---------- */
    const conv = H.h('div', { class: 'grid2 even' });
    const mkConv = (title, units, toBase, fromBase, init, note) => {
      const box = H.h('div', {}, H.h('h4', {}, title));
      const inputs = units.map(([u, d]) => { const i = H.h('input', { type: 'number', step: 'any' }); i.dataset.d = d; box.append(H.h('div', { class: 'ctrl' }, H.h('div', { class: 'lab' }, u), i)); return i; });
      const setAll = (base, except) => units.forEach(([u], k) => { if (k !== except) inputs[k].value = +fromBase[k](base).toFixed(+inputs[k].dataset.d); });
      inputs.forEach((i, k) => i.addEventListener('input', () => { const v = parseFloat(i.value); if (isFinite(v)) setAll(toBase[k](v), k); }));
      setAll(init, -1); if (note) box.append(H.h('p', { class: 'small', html: note }));
      return box;
    };
    conv.append(
      mkConv('Temperatura', [['Celsius (°C)', 2], ['Fahrenheit (°F)', 2], ['Kelvin (K)', 2]],
        [(c) => c, (f) => (f - 32) * 5 / 9, (k) => k - 273.15], [(c) => c, (c) => c * 9 / 5 + 32, (c) => c + 273.15], 20,
        '<span class="formula">C/100 = (F − 32)/180</span> &nbsp; <span class="formula">T = C + 273,15</span>. El kelvin se escribe K, sin grado.'),
      mkConv('Presión', [['Hectopascal = milibar (hPa = mb)', 2], ['Milímetros de mercurio (mmHg)', 1], ['Atmósferas (atm)', 4], ['Pascales (Pa)', 0]],
        [(h) => h, (m) => m * 1.333224, (a) => a * 1013.25, (p) => p / 100], [(h) => h, (h) => h / 1.333224, (h) => h / 1013.25, (h) => h * 100], 1013.25,
        'Presión normal a nivel del mar: <b>1.013,25 hPa</b> = 760 mmHg = 1 atm.'));
    el.append(H.h('div', { class: 'card' }, H.h('h3', {}, 'Medida de los elementos climáticos: conversores'), H.h('p', { class: 'sub' }, 'Escribe en cualquier casilla; las demás se actualizan.'), conv));

    /* ---------- C · calor específico ---------- */
    const MAT = [['Agua', 4.18, 1000, '#1f6f8b'], ['Hielo', 2.09, 917, '#8cc8d6'], ['Suelo húmedo', 1.48, 1700, '#7a5a3a'], ['Suelo seco / arena', 0.8, 1600, '#c8a15a'], ['Granito', 0.79, 2700, '#8a8a8a'], ['Aire', 1.005, 1.2, '#d9b48f']];
    const ce = { mode: 'masa', E: 100 };
    const ceBox = H.h('div');
    const drawCe = () => {
      const res = MAT.map(([n, c, rho, col]) => { const cap = ce.mode === 'masa' ? c : c * rho; const dT = ce.E / cap; return { n, cap, dT, col }; });
      const max = Math.max(...res.map((r) => Math.min(r.dT, 1e9)));

      ceBox.innerHTML = `<table class="t flowtable"><thead><tr><th>Material</th><th>${ce.mode === 'masa' ? 'Calor específico (J/g·°C)' : 'Capacidad calorífica (kJ/m³·°C)'}</th><th>Subida de temperatura</th><th style="width:40%"></th></tr></thead><tbody>${res.map((r) => `<tr><td><b>${r.n}</b></td><td class="n">${H.f(r.cap, ce.mode === 'masa' ? 2 : 1)}</td><td class="n">${r.dT > 999 ? '&gt; 999' : H.f(r.dT, r.dT < 1 ? 3 : 1)} °C</td><td><div style="background:var(--soft);border-radius:3px;height:12px"><div style="width:${Math.min(100, r.dT / lim * 100)}%;height:100%;border-radius:3px;background:${r.col}"></div></div></td></tr>`).join('')}</tbody></table>`;
      ratio.innerHTML = ce.mode === 'masa' ? `Por unidad de masa, el agua necesita <b>${H.f(4.18 / 1.005, 1)} veces</b> más calor que el aire para subir 1 °C.` : `Por unidad de volumen, el agua necesita <b>${H.f(4.18 * 1000 / (1.005 * 1.2), 0)} veces</b> más calor que el aire: un metro cúbico de agua guarda tanto calor como ≈ 3.500 m³ de aire.`;
    };
    const ratio = H.h('p', {});
    const modeSeg = H.seg([['masa', 'Por gramo'], ['vol', 'Por metro cúbico']], 'masa', (v) => { ce.mode = v; eS.set(v === 'masa' ? 100 : 1000, false); ce.E = v === 'masa' ? 100 : 1000; drawCe(); });
    const eS = H.slider('Energía aportada', 1, 1000, 1, ce.E, (v) => ce.mode === 'masa' ? `${H.f(v)} J a 1 g` : `${H.f(v)} kJ a 1 m³`, (v) => { ce.E = v; drawCe(); });
    el.append(H.h('div', { class: 'card' }, H.h('h3', {}, 'Calor específico: misma energía, distinto calentamiento'),
      H.h('p', { class: 'sub' }, 'Aportamos la misma cantidad de calor a materiales distintos. Cambia entre «por gramo» y «por metro cúbico»: la segunda comparación es la que importa para el clima, porque el mar almacena calor en volúmenes enormes.'),
      H.h('div', { class: 'grid2' }, ceBox, H.h('div', {}, modeSeg, H.h('div', { style: { height: '10px' } }), eS, ratio))));

    const rhoAir = (t, hr, p = 1013.25) => { const e = T2.es(t) * hr / 100; const Tk = t + 273.15; return ((p - e) * 100 / (T2.Rd * Tk) + e * 100 / (T2.Rv * Tk)); };

      { q: 'Una masa de aire a 20 °C contiene 12 g/m³ de vapor. Si se enfría a 16 °C sin ganar ni perder vapor, su humedad relativa…', opts: ['Baja', 'Sube', 'No cambia', 'Se hace cero'], a: 1, ex: 'La humedad absoluta no cambia, pero la de saturación baja (de 17,3 a 13,6 g/m³): la relativa sube de ≈ 69 % a ≈ 88 %.' },

      { q: '¿Por qué el mar suaviza el clima de las costas?', opts: ['Porque el agua tiene menor calor específico que la tierra', 'Porque el agua almacena mucho calor por unidad de volumen y se calienta y enfría despacio', 'Porque el agua refleja casi toda la radiación', 'Porque el aire del mar es más denso'], a: 1, ex: 'Su elevada capacidad calorífica, unida a la mezcla y a la penetración de la luz, le da una gran inercia térmica.' },

/* ===================== I · BALANCE ENERGÉTICO ===================== */
H.tab({
  id: 'balance', nav: 'Balance energético', title: 'Balance energético y efecto invernadero',
  init(el) {
    el.append(H.intro('La insolación terrestre · apartados 4 y 5', 'Balance energético y efecto invernadero',
      'La Tierra recibe energía del Sol en onda corta y la devuelve al espacio en onda larga. Por término medio entra tanta energía como sale, pero por el camino la atmósfera la absorbe, la refleja, la dispersa y la reemite. Ese reparto explica que la superficie esté a unos 15 °C y no a −18 °C, la temperatura que tendría sin efecto invernadero.',
      'Manual: 4 y 5.1<br>Figs. 2.4 a 2.8'));

    /* ---------- A · balance global ---------- */
    const DATA = {
      manual: { inc: 100, refAtm: 35, refSfc: 0, absAtm: 20, sfcIn: 45, sfcAbs: 45, lwUp: 120, win: 15, back: 105, atmOut: 50, lat: 20, sen: 10, unit: '' },
      actual: { inc: 341.3, refAtm: 79, refSfc: 23, absAtm: 78, sfcIn: 184, sfcAbs: 161, lwUp: 396, win: 40, back: 333, atmOut: 199, lat: 80, sen: 17, unit: 'W/m²' },

      const W = 1000, Ht = 470, yT = 96, yS = 396, k = 0.26; // px por punto porcentual

      const vArrow = (x, y1, y2, v, col) => { // flecha vertical; y2 es la punta

      const SW = '#e2a72a', SWr = '#efc768', LW = '#c0503a', NR = '#4f86a8';

        .fl{font:12px system-ui,sans-serif;fill:#1c2836}.fl .v{font-weight:700;font-size:13px}.fl .u{font-weight:400;fill:#5a6878}.fl .d{fill:#5a6878;font-size:11px}
        .ttl{font:bold 11px system-ui;letter-spacing:.1em;fill:#5a6878}.rg{font:bold 10px system-ui;letter-spacing:.12em;fill:#8a96a3}</style>
        <rect x="0" y="${yT}" width="${W}" height="${yS - yT}" fill="#eef4f7"/>
        <rect x="0" y="${yS}" width="${W}" height="${Ht - yS}" fill="#e9dcb8"/>
        <line x1="0" y1="${yT}" x2="${W}" y2="${yT}" stroke="#1c2836" stroke-dasharray="6 4"/>
        <line x1="392" y1="22" x2="392" y2="${Ht}" stroke="#fff" stroke-width="3"/><line x1="772" y1="22" x2="772" y2="${Ht}" stroke="#fff" stroke-width="3"/>
        <text x="196" y="14" class="ttl" text-anchor="middle">ONDA CORTA (SOLAR)</text><text x="582" y="14" class="ttl" text-anchor="middle">ONDA LARGA (TERRESTRE)</text><text x="886" y="14" class="ttl" text-anchor="middle">SIN RADIACIÓN</text>
        <text x="${W - 8}" y="${yT - 8}" class="rg" text-anchor="end">ESPACIO</text><text x="${W - 8}" y="${yT + 16}" class="rg" text-anchor="end">ATMÓSFERA</text><text x="${W - 8}" y="${yS + 16}" class="rg" text-anchor="end">SUPERFICIE</text>`;
      // onda corta
      s += vArrow(50, 30, 168, d.inc, SW) + tl(R(50, d.inc), 52, d.inc, 'radiación entrante');
      s += vArrow(222, 168, 30, d.refAtm, SWr) + tl(R(222, d.refAtm), 52, d.refAtm, b.mode === 'manual' ? 'reflejada (25) y difundida (10)' : 'reflejada por nubes y aire');

      else s += `<text x="352" y="330" class="fl" text-anchor="end"><tspan class="d">reflexión del suelo: incluida</tspan><tspan x="352" dy="14" class="d">en la de las nubes</tspan></text>`;
      s += tl(50, yS + 34, d.sfcAbs, 'absorbida por la superficie');
      // onda larga
      s += vArrow(425, yS - 2, 190, d.lwUp, LW) + tl(425, 156, d.lwUp, 'emitida por el suelo', 'middle');
      s += vArrow(530, 190, yS - 2, d.back, LW) + tl(530, 156, d.back, 'contrarradiación', 'middle');
      s += vArrow(610, yS - 2, 30, d.win, LW) + tl(R(610, d.win), 52, d.win, 'ventana');
      s += vArrow(722, 190, 30, d.atmOut, LW) + tl(R(722, d.atmOut), 52, d.atmOut, 'al espacio');
      // otros flujos
      s += vArrow(815, yS - 2, 214, d.lat, NR) + tl(815, 180, d.lat, 'calor latente', 'middle');
      s += vArrow(935, yS - 2, 274, d.sen, NR) + tl(935, 240, d.sen, 'calor sensible', 'middle');
      s += `</svg>`;
      svgBox.innerHTML = s;
      const toa = d.refAtm + d.refSfc + d.win + d.atmOut, atmIn = d.absAtm + (d.lwUp - d.win) + d.lat + d.sen, atmOut = d.back + d.atmOut, sIn = d.sfcAbs + d.back, sOut = d.lwUp + d.lat + d.sen;
      const row = (n, a, c) => `<tr><td><b>${n}</b></td><td class="n">${H.f(a)}</td><td class="n">${H.f(c)}</td><td class="n">${a - c > 0.5 ? '+' : ''}${H.f(a - c)}</td></tr>`;

/* ===================== I · TIERRAS Y MARES ===================== */
H.tab({

  id: 'cuestionario', nav: 'Cuestionario final', title: 'Cuestionario final',
  init(el) {
    el.append(H.intro('Repaso del tema', 'Cuestionario final',
      'Veinte preguntas sobre todo el tema, en orden aleatorio. Responde todas y pulsa «Corregir»: verás la puntuación, la explicación de cada pregunta y un enlace al interactivo donde repasarla.',
      'Tema 2 completo'));
    const BANK = [
      ['estructura', '¿Cuál es el gas más abundante del aire seco?', ['Oxígeno', 'Nitrógeno', 'Argón', 'Dióxido de carbono'], 1, 'El nitrógeno supone ≈ 78 % del volumen del aire seco; el oxígeno, ≈ 21 %.'],
      ['estructura', 'La proporción actual de CO₂ en la atmósfera es de unos…', ['0,0325 % (325 ppm)', '0,042 % (425 ppm)', '0,4 % (4.000 ppm)', '4 %'], 1, 'Ronda los 425 ppm (2025). El valor del manual, 325 ppm, corresponde a comienzos de la década de 1970.'],
      ['estructura', 'En la troposfera, la temperatura desciende por término medio…', ['0,65 °C cada 100 m', '1 °C cada 1.000 m', '6,5 °C cada 100 m', 'No desciende'], 0, 'Es el gradiente vertical medio: 6,5 °C por kilómetro.'],
      ['estructura', 'El calentamiento de la estratosfera se debe a…', ['La absorción del ultravioleta por el ozono', 'El calor que asciende desde el suelo', 'La condensación del vapor de agua', 'La compresión del aire'], 0, 'El ozono absorbe el UV solar; por eso la temperatura aumenta con la altura en esta capa.'],
      ['estructura', 'La tropopausa se encuentra más alta…', ['Sobre los polos', 'Sobre el ecuador', 'En latitudes medias', 'Sobre los océanos'], 1, 'Unos 16–17 km sobre el ecuador frente a 8–9 km sobre los polos.'],
      ['estructura', 'Por debajo de unos 5,5 km de altitud se concentra…', ['La décima parte de la masa del aire', 'La mitad de la masa del aire', 'Casi toda la masa del aire', 'La cuarta parte'], 1, 'A esa altura la presión es ≈ 500 hPa, la mitad de la del nivel del mar.'],
      ['aire', 'Una masa de aire a 20 °C con 12 g/m³ de vapor tiene una humedad relativa de aproximadamente…', ['12 %', '50 %', '69 %', '100 %'], 2, 'La saturación a 20 °C es ≈ 17,3 g/m³: 12 / 17,3 ≈ 69 %.'],
      ['aire', 'Si una masa de aire se enfría sin cambiar su contenido de vapor, su humedad relativa…', ['Disminuye', 'Aumenta', 'No cambia', 'Se anula'], 1, 'Disminuye la cantidad máxima de vapor admisible, así que la relativa sube hasta saturarse en el punto de rocío.'],
      ['aire', 'Por unidad de masa, el calor específico del agua es, respecto al del aire, unas…', ['2 veces mayor', '4 veces mayor', '10 veces mayor', '3.500 veces mayor'], 1, '4,18 frente a 1,005 J/g·°C. Por unidad de volumen la diferencia es de unas 3.500 veces.'],
      ['aire', '1.013,25 hPa equivalen a…', ['1 atm y 760 mmHg', '1 bar y 1.000 mmHg', '10 atm', '101 Pa'], 0, 'Es la presión normal a nivel del mar; 1 hPa = 1 mb = 100 Pa.'],
      ['aire', '¿Qué aire tiende a ascender?', ['El frío y seco', 'El caliente y húmedo', 'El frío y húmedo', 'Cualquiera, por igual'], 1, 'El calentamiento y el vapor de agua reducen la densidad del aire.'],
      ['balance', 'La energía solar llega a la Tierra principalmente como…', ['Onda larga (infrarrojo térmico)', 'Onda corta (visible, infrarrojo cercano y ultravioleta)', 'Rayos X', 'Ondas de radio'], 1, 'El Sol, a ≈ 5.500 °C, emite sobre todo hacia 0,5 µm; la Tierra, a ≈ 15 °C, hacia 10 µm.'],
      ['balance', 'El albedo planetario actual es de aproximadamente…', ['2 %', '10 %', '30 %', '60 %'], 2, 'La Tierra refleja ≈ 30 % de la radiación solar, sobre todo por las nubes.'],
      ['balance', 'El efecto invernadero se debe a que la atmósfera…', ['Refleja la radiación solar', 'Deja pasar la onda corta y absorbe buena parte de la onda larga que emite el suelo', 'Produce calor por sí misma', 'Bloquea la radiación ultravioleta'], 1, 'Los gases como el vapor de agua o el CO₂ absorben el infrarrojo terrestre y reemiten parte hacia el suelo.'],
      ['balance', 'Sin atmósfera, con el mismo albedo, la temperatura media de la superficie sería de unos…', ['+15 °C', '0 °C', '−18 °C', '−50 °C'], 2, 'Es la temperatura de equilibrio radiativo; el efecto invernadero añade ≈ 33 °C.'],
      ['balance', 'La mayor insolación en la superficie terrestre se registra…', ['En el ecuador', 'En los desiertos subtropicales', 'En los polos en verano', 'En latitudes medias'], 1, 'Cielos despejados y Sol alto: en el ecuador la nubosidad reduce mucho la energía que llega al suelo.'],
      ['tierramar', 'La amplitud térmica diaria es menor sobre el mar porque…', ['El mar recibe menos radiación', 'El agua almacena mucho calor, lo reparte en profundidad y cambia de temperatura despacio', 'El mar tiene un albedo muy alto', 'Sobre el mar no hay día ni noche'], 1, 'Capacidad calorífica, penetración de la luz y mezcla dan al mar una gran inercia térmica.'],
      ['tierramar', 'A una misma latitud, la amplitud térmica anual es mayor…', ['En la costa occidental de un continente', 'En el interior de un continente', 'En una isla', 'En pleno océano'], 1, 'Es la continentalidad: inviernos muy fríos y veranos cálidos.'],
      ['tierramar', 'En latitudes medias, las costas occidentales de los continentes tienen inviernos más suaves que las orientales por…', ['La mayor altitud', 'Los vientos del oeste de origen oceánico y las corrientes cálidas', 'La menor nubosidad', 'La rotación de la Tierra'], 1, 'Compárese A Coruña (11 °C en enero) con Vladivostok (−12 °C), a la misma latitud.'],
      ['diario', 'La temperatura máxima diaria se produce normalmente…', ['A mediodía solar', 'Unas 2–3 horas después del mediodía solar', 'Al ponerse el Sol', 'A medianoche'], 1, 'El suelo y el aire siguen ganando energía hasta primera hora de la tarde.'],
      ['diario', 'La temperatura mínima diaria suele registrarse…', ['A medianoche', 'Hacia la salida del Sol', 'A mediodía', 'Al ponerse el Sol'], 1, 'El enfriamiento por radiación continúa toda la noche.'],
      ['diario', 'Con una máxima de 28 °C y una mínima de 12 °C, la amplitud y la media diarias son…', ['16 °C y 20 °C', '40 °C y 20 °C', '16 °C y 16 °C', '20 °C y 16 °C'], 0, 'Amplitud = 28 − 12 = 16 °C; media ≈ (28 + 12)/2 = 20 °C.'],
      ['anual', 'El régimen térmico de un lugar se define con…', ['La temperatura de un día cualquiera', 'Las temperaturas medias mensuales de un periodo de al menos 30 años', 'La máxima absoluta registrada', 'La temperatura media anual'], 1, 'El periodo de referencia vigente es 1991–2020.'],
      ['anual', 'En el hemisferio norte, el mes más cálido en el interior de los continentes suele ser…', ['Junio', 'Julio', 'Septiembre', 'Diciembre'], 1, 'Hay un retraso de unas cuatro semanas respecto al solsticio; junto al mar, el máximo llega en agosto.'],
      ['anual', 'La amplitud térmica anual es mínima…', ['En Siberia', 'En el ecuador', 'En el Mediterráneo', 'En los polos'], 1, 'En el ecuador la insolación apenas cambia a lo largo del año: amplitudes de 1–3 °C.'],
      ['isotermas', 'Una isoterma es una línea que une puntos de igual…', ['Presión', 'Precipitación', 'Temperatura', 'Altitud'], 2, 'Isobaras, isoyetas e isohipsas son las de presión, precipitación y altitud.'],
      ['isotermas', 'Una estación a 800 m de altitud registra 13 °C. Su temperatura reducida al nivel del mar es…', ['13 °C', '18,2 °C', '7,8 °C', '21 °C'], 1, '13 + 0,65 × 8 = 18,2 °C (ejemplo del manual).'],
      ['isotermas', 'El ecuador térmico…', ['Coincide siempre con el ecuador geográfico', 'Se desplaza hacia el hemisferio en verano, sobre todo sobre los continentes', 'Está siempre en el hemisferio sur', 'Sigue el trópico de Cáncer todo el año'], 1, 'En julio se adentra mucho en el hemisferio norte por el recalentamiento del Sahara, Arabia y Asia.'],
    ];
    const box = H.h('div');
    let qs = [], answers = [];
    const build = () => {
      qs = [...BANK].sort(() => Math.random() - 0.5).slice(0, 20).map(([tab, q, opts, a, ex]) => { const idx = opts.map((_, i) => i).sort(() => Math.random() - 0.5); return { tab, q, opts: idx.map((i) => opts[i]), a: idx.indexOf(a), ex }; });
      answers = new Array(qs.length).fill(null);
      box.innerHTML = '';
      const prog = H.h('p', { class: 'small' }, `0 de ${qs.length} respondidas`);
      const list = H.h('div', { class: 'card' });
      qs.forEach((q, i) => {
        const opts = H.h('div', { class: 'opts' });
        q.opts.forEach((o, j) => { const b = H.h('button', { class: 'opt', type: 'button', html: `<span class="l">${'abcd'[j]})</span><span>${o}</span>` }); b.onclick = () => { if (box.dataset.done) return; answers[i] = j; H.$$('.opt', opts).forEach((x, k) => { x.style.borderColor = k === j ? 'var(--ink)' : ''; x.style.background = k === j ? 'var(--soft)' : ''; }); prog.textContent = `${answers.filter((x) => x !== null).length} de ${qs.length} respondidas`; }; opts.append(b); });
        list.append(H.h('div', { class: 'q' }, H.h('div', { class: 'qt', html: `<span class="n">${i + 1}.</span>${q.q}` }), opts, H.h('div', { class: 'fb' })));
      });
      const corr = H.h('button', { class: 'btn acc', type: 'button' }, 'Corregir');
      const again = H.h('button', { class: 'btn ghost', type: 'button', style: { display: 'none' } }, 'Nuevo cuestionario');
      const result = H.h('div');
      corr.onclick = () => {
        const pend = answers.filter((x) => x === null).length;
        if (pend && !confirm(`Te faltan ${pend} preguntas. ¿Corregir de todos modos?`)) return;
        box.dataset.done = '1'; let ok = 0; const weak = {};
        H.$$('.q', list).forEach((qe, i) => {
          const q = qs[i], good = answers[i] === q.a; if (good) ok++; else weak[q.tab] = (weak[q.tab] || 0) + 1;
          H.$$('.opt', qe).forEach((x, k) => { x.disabled = true; x.style.background = ''; x.style.borderColor = ''; if (k === q.a) x.classList.add('ok'); else if (k === answers[i]) x.classList.add('ko'); });
          const t = H.TABS.find((x) => x.id === q.tab);
          const fb = H.$('.fb', qe); fb.className = 'fb show ' + (good ? 'ok' : 'ko'); fb.innerHTML = `<b>${good ? 'Correcto.' : answers[i] === null ? 'Sin responder.' : 'No es correcto.'}</b>${q.ex} <a href="#${q.tab}">Repasar en «${t.nav}» →</a>`;
        });
        const nota = ok / qs.length * 10;
        const wk = Object.entries(weak).sort((a, b) => b[1] - a[1]).map(([k, n]) => { const t = H.TABS.find((x) => x.id === k); return `<a href="#${k}">${t.nav}</a> (${n})`; });
        result.innerHTML = `<div class="result-box"><div class="big">${H.f(nota, 1)}</div><div>${ok} aciertos de ${qs.length}</div>${wk.length ? `<p class="small">Conviene repasar: ${wk.join(' · ')}</p>` : '<p class="small">Ningún fallo. Tema dominado.</p>'}</div>`;
        corr.style.display = 'none'; again.style.display = ''; result.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      again.onclick = () => { delete box.dataset.done; build(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      box.append(prog, list, result, H.h('div', { class: 'exam-nav' }, corr, again));
    };
    build();
    el.append(box);
  },
});

H.start();

</script>
