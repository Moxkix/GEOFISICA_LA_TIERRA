<title>Tema 3 · La presión y la humedad</title>

<style>:root{
  --paper:#f6f3ea; --card:#fffdf8; --ink:#1c2836; --muted:#5a6878; --line:#ddd5c3; --soft:#efe9da;
  --accent:#b4531d; --accent-soft:#f6e3d6; --blue:#1f6f8b; --blue-soft:#dcebf1;
  --ok:#2d7a4c; --ok-soft:#e1f1e6; --bad:#b0393a; --bad-soft:#f7e1df; --warn:#8a6512; --warn-soft:#f6edd2;
  --land:#e4d3a8; --ocean:#cfe0ea;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em}
h2{font-size:1.7rem} h3{font-size:1.2rem;margin-top:.2em} h4{font-size:1.02rem}
p{margin:.4em 0 .8em}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
small,.small{font-size:.86rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header.top{background:var(--ink);color:#f3efe4;padding:14px 20px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand{display:flex;flex-direction:column;flex:1;min-width:240px}
.brand .kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#d9b48f}
.brand .title{font-family:var(--serif);font-size:1.22rem;line-height:1.2}
.place-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 6px 5px 14px;cursor:pointer;color:#f3efe4;max-width:100%}
.place-pill:hover{background:rgba(255,255,255,.14)}
.place-pill .lbl{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.place-pill b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.place-pill .chg{background:#d9b48f;color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:12px auto 0;scrollbar-width:thin}
nav.tabs .grp{display:flex;flex-direction:column;flex:none}
nav.tabs .grp-name{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#d9b48f;padding:0 10px;opacity:.85}
nav.tabs .grp-btns{display:flex;gap:2px}
nav.tabs button{background:transparent;border:0;color:#cfd6df;padding:7px 12px 10px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-size:.93rem}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);font-weight:600}
nav.tabs .sep{width:1px;background:rgba(255,255,255,.15);margin:14px 6px 6px}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.intro{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.intro .lead{color:var(--muted);max-width:820px;margin:0}
.intro .ref{font-size:.8rem;color:var(--muted);text-align:right;border-left:3px solid var(--accent);padding-left:10px}
.intro .eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.card>h3:first-child{margin-top:0}
.card .sub{color:var(--muted);font-size:.92rem;margin-top:-.2em}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid2.even{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2,.grid2.even,.grid3{grid-template-columns:1fr}.intro{grid-template-columns:1fr}.intro .ref{text-align:left}}

.viz{position:relative;width:100%}
.viz canvas,.viz svg{display:block;width:100%;height:auto;border-radius:8px}
.viz.framed canvas,.viz.framed svg{border:1px solid var(--line);background:#fff}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.hint::before{content:"↳ ";color:var(--accent)}

/* controles */
.ctrl{margin:0 0 12px}
.ctrl label,.ctrl .lab{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;margin-bottom:3px}
.ctrl label output,.ctrl .lab output{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:.86rem}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=text],input[type=date],select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:.86rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:#2c3e53}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;margin-right:14px;cursor:pointer}
.chk input{accent-color:var(--accent)}

/* lecturas */
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ro{background:var(--soft);border-radius:8px;padding:8px 10px}
.ro .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ro .v{font-family:var(--serif);font-size:1.25rem;font-variant-numeric:tabular-nums}
.ro .v small{font-family:var(--sans)}
.ro.hl{background:var(--accent-soft)}
.ro.bl{background:var(--blue-soft)}
.formula{font-family:var(--serif);font-style:italic;background:var(--soft);padding:6px 10px;border-radius:6px;display:inline-block}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.t td.bad{color:var(--bad)} table.t td.good{color:var(--ok);font-weight:600}

/* notas de corrección */
.fix{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.fix .fh{font-weight:700;color:var(--warn);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.fix ul{margin:.2em 0;padding-left:1.2em}
.fix s{color:var(--bad);text-decoration-thickness:1.5px}
.info{border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}

/* autoevaluación */
.selfcheck{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-top:8px}
.selfcheck>h3{display:flex;align-items:center;gap:10px}
.selfcheck>h3 .score{margin-left:auto;font-family:var(--sans);font-size:.85rem;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 12px}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:8px}
.q .qt .n{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:.93rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .l{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;font-size:.9rem;padding:8px 11px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
details.open-q{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:#fff}
details.open-q summary{cursor:pointer;font-weight:600}
details.open-q .ans{margin-top:8px;font-size:.93rem;border-top:1px dashed var(--line);padding-top:8px}

/* buscador municipio */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,40,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-top:0}
.sugg{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;background:#fff}
.sugg li{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;gap:10px}
.sugg li:last-child{border-bottom:0}
.sugg li:hover,.sugg li.sel{background:var(--accent-soft)}
.sugg li small{white-space:nowrap}
.modal .alt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
.modal .alt>div{flex:1;min-width:100px}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr);gap:18px;align-items:start;margin-bottom:18px}
.toc3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.cmap svg{width:100%;height:auto}
.cmap .node{cursor:pointer}
.cmap .node rect{fill:#fff;stroke:var(--ink);stroke-width:1.2;transition:fill .15s}
.cmap .node:hover rect{fill:var(--accent-soft)}
.cmap .node text{font-family:var(--sans);font-size:13.5px;fill:var(--ink);pointer-events:none}
.cmap .node.root rect{fill:var(--ink)} .cmap .node.root text{fill:#fff;font-weight:700}
.cmap .node.hub rect{fill:var(--soft)}
.cmap .node.dis{cursor:default}.cmap .node.dis rect,.cmap .node.dis:hover rect{fill:#f3f0e8;stroke:#b7ae9c;stroke-dasharray:4 3}.cmap .node.dis text{fill:#8a8272}
.cmap .node.ext rect{stroke:var(--blue);stroke-dasharray:5 3}
.cmap .node text.tag{font-size:9.5px;fill:var(--blue);font-weight:700;letter-spacing:.04em}
.tlegend{margin-top:6px}
.wide-svg{overflow-x:auto}
@media (max-width:700px){.wide-svg svg{min-width:640px}}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}
.chipbar .chip{font-family:var(--sans);font-size:.82rem;padding:4px 10px}
.flowtable td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmap .edge{stroke:#8a96a3;stroke-width:1.2;fill:none}
.cmap .tag{font-size:10px;fill:var(--accent);font-weight:700;letter-spacing:.04em}
.toc{display:grid;gap:8px}
.toc a{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.toc a:hover{border-color:var(--accent)}
.toc a .i{font-family:var(--serif);font-size:1.3rem;color:var(--accent);text-align:center}
.toc a .d{font-size:.83rem;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;font-size:.8rem;color:var(--muted)}

.tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.8rem;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:5;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.badge.c{background:#e2ecf8;color:#24538a}.badge.e{background:#e3f1e3;color:#2d6a3a}.badge.q{background:#f6e7d6;color:#8a4b14}.badge.n{background:#eee;color:#666}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.kbd{font-family:var(--mono);font-size:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.clock{font-family:var(--serif);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.ko{background:var(--bad-soft);color:var(--bad)}
.sortlist{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:#fff}
.chip{border:1px solid var(--ink);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;font-family:var(--mono);font-size:.88rem}
.chip.sel{background:var(--ink);color:#fff}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)} .chip.ko{border-color:var(--bad);background:var(--bad-soft)}
.exam-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.result-box{text-align:center;padding:20px;border-radius:12px;background:var(--soft);margin-bottom:12px}
.result-box .big{font-family:var(--serif);font-size:3rem;line-height:1}
@media print{header.top,nav.tabs{display:none}section.tab{display:block!important}}
.brand .kicker .home-link{color:#f3efe4;text-decoration:none;font-weight:700;border-bottom:1px solid rgba(243,239,228,.4)}
.brand .kicker .home-link:hover{border-bottom-color:#f3efe4}
@media (max-width:700px){header.top{position:static}.brand .kicker{font-size:0;letter-spacing:0}.brand .kicker .home-link{font-size:.75rem;letter-spacing:.1em}.brand .title{font-size:1.05rem}main{padding:16px 12px 50px}h2{font-size:1.4rem}.card{padding:14px 12px}}
.ro.wide{grid-column:1/-1}.ro.wide .v{font-size:1.1rem}
</style>
</head>

  H.riseAzimuth = (lat, decl) => { const c = Math.sin(decl * D2R) / Math.cos(lat * D2R); if (c >= 1) return 0; if (c <= -1) return 180; return Math.acos(c) * R2D; };
  H.toaInsolation = (lat, decl, R = 1) => {
    const p = lat * D2R, dd = decl * D2R;
    let c = -Math.tan(p) * Math.tan(dd); c = H.clamp(c, -1, 1);
    const h = Math.acos(c);
    const q = (H.K.S0 / Math.PI) / (R * R) * (h * Math.sin(p) * Math.sin(dd) + Math.cos(p) * Math.cos(dd) * Math.sin(h));
    return Math.max(0, q);
  };
  /* equinoccios, solsticios, perihelio y afelio del año (fechas en UTC) */
  H.events = (year = H.year) => {
    const t0 = Date.UTC(year, 0, 1);
    const Lat = (ms) => H.sun(ms).L;
    const find = (target) => {
      let prev = null;
      for (let h = 0; h < 366 * 24; h += 6) {
        const ms = t0 + h * 36e5; let diff = ((Lat(ms) - target + 540) % 360) - 180;
        if (prev && prev.diff < 0 && diff >= 0) {
          let a = prev.ms, b = ms;
          for (let i = 0; i < 30; i++) { const m = (a + b) / 2; const dm = ((Lat(m) - target + 540) % 360) - 180; if (dm < 0) a = m; else b = m; }
          return new Date((a + b) / 2);
        }
        prev = { ms, diff };
      }
    };
    let minR = { R: 9 }, maxR = { R: 0 };
    for (let h = 0; h < 366 * 24; h += 3) { const ms = t0 + h * 36e5; const R = H.sun(ms).R; if (R < minR.R) minR = { R, ms }; if (R > maxR.R) maxR = { R, ms }; }

  H.EV = H.events();

  const PA = { 2026: ['2026-01-03T17:16:00Z', 0.983301, '2026-07-06T17:31:00Z', 1.016643] };
  if (PA[H.year]) { const [p, pr, a, ar] = PA[H.year]; Object.assign(H.EV, { peri: new Date(p), periR: pr, afe: new Date(a), afeR: ar, verified: true }); }

  /* hora oficial en España (UTC+1 / UTC+0 en Canarias, + horario de verano UE) */
  H.lastSunday = (y, m) => { const d = new Date(Date.UTC(y, m + 1, 0)); return Date.UTC(y, m, d.getUTCDate() - d.getUTCDay(), 1); };
  H.isSummerTime = (ms) => { const y = new Date(ms).getUTCFullYear(); return ms >= H.lastSunday(y, 2) && ms < H.lastSunday(y, 9); };
  H.officialOffset = (place, ms) => {
    if (!place || !place.es) return null;

  H.haversine = (la1, lo1, la2, lo2) => {
    const p1 = la1 * D2R, p2 = la2 * D2R, dp = p2 - p1, dl = (lo2 - lo1) * D2R;
    const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;

  };

  /* ---------- máscara de tierras emergidas (equirectangular 0,25°) ---------- */
  const MW = 1440, MH = 720;
  let MASK = null;
  H.buildMask = () => {
    if (MASK) return MASK;
    const c = document.createElement('canvas'); c.width = MW; c.height = MH;
    const x = c.getContext('2d'); x.fillStyle = '#000';
    for (const poly of LAND) {
      for (const off of [-360, 0, 360]) {
        x.beginPath();
        for (const ring of poly) {
          for (let i = 0; i < ring.length; i += 2) {
            const px = (ring[i] + off + 180) * 4, py = (90 - ring[i + 1]) * 4;
            i ? x.lineTo(px, py) : x.moveTo(px, py);
          }
          x.closePath();
        }
        x.fill('evenodd');
      }
    }
    const d = x.getImageData(0, 0, MW, MH).data;
    MASK = new Uint8Array(MW * MH);
    for (let i = 0; i < MW * MH; i++) MASK[i] = d[i * 4 + 3];
    return MASK;
  };
  /* fracción de tierra 0..1 con interpolación bilineal (bordes suaves) */
  H.land = (lat, lon) => {
    const m = MASK || H.buildMask();
    let fx = ((lon + 180) % 360 + 360) % 360 * 4 - 0.5, fy = (90 - lat) * 4 - 0.5;
    if (fy < 0) fy = 0; if (fy > MH - 1) fy = MH - 1;
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
    const xa = (x0 + MW) % MW, xb = (x0 + 1) % MW, y1 = Math.min(MH - 1, y0 + 1);
    const v = m[y0 * MW + xa] * (1 - tx) * (1 - ty) + m[y0 * MW + xb] * tx * (1 - ty) + m[y1 * MW + xa] * (1 - tx) * ty + m[y1 * MW + xb] * tx * ty;
    return v / 255;
  };
  H.COL = { ocean: [207, 224, 234], land: [228, 211, 168], landD: [176, 160, 120], oceanD: [150, 178, 196], ink: '#1c2836', accent: '#b4531d', blue: '#1f6f8b', grid: 'rgba(28,40,54,.22)' };
  H.mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  H.surface = (lat, lon) => H.mix(H.COL.ocean, H.COL.land, H.land(lat, lon));

  /* ---------- canvas adaptativo con alta densidad ---------- */
  H.autoCanvas = (canvas, aspect, draw, opts = {}) => {
    const st = { canvas, ctx: canvas.getContext('2d'), w: 0, h: 0, dpr: 1 };
    const fit = () => {
      const w = Math.max(200, Math.round(canvas.parentElement.clientWidth));
      if (!canvas.parentElement.clientWidth) return false;
      const h = Math.round(typeof aspect === 'function' ? aspect(w) : w * aspect);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      if (w !== st.w || h !== st.h || dpr !== st.dpr) {
        st.w = w; st.h = h; st.dpr = dpr;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        canvas.style.height = h + 'px';
        st.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      }
      return false;
    };
    st.redraw = () => { if (!canvas.parentElement) return; if (!st.w) fit(); if (st.w) { st.ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0); draw(st.ctx, st.w, st.h, st); } };
    const attach = () => { if (!canvas.parentElement) return setTimeout(attach, 20); new ResizeObserver(() => { if (fit()) st.redraw(); }).observe(canvas.parentElement); };
    attach();
    st.pos = (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * st.w / r.width, (t.clientY - r.top) * st.h / r.height]; };
    return st;
  };
  /* arrastre con ratón y táctil */
  H.drag = (el, { down, move, up }) => {
    let on = false;
    const dn = (e) => { on = true; down && down(e); if (e.cancelable && e.type === 'touchstart') e.preventDefault(); };
    const mv = (e) => { if (on) { move && move(e); if (e.cancelable && e.type === 'touchmove') e.preventDefault(); } };
    const u = (e) => { if (on) { on = false; up && up(e); } };

  };

  /* ---------- gráfico de líneas genérico ---------- */
  H.chart = (canvas, aspect = 0.42) => {
    const ch = { opts: null, hover: null };
    const P = { l: 54, r: 14, t: 14, b: 38 };
    const st = H.autoCanvas(canvas, aspect, (ctx, w, h) => {
      const o = ch.opts; if (!o) return;
      Object.assign(P, { l: 54, r: 14, t: 14, b: 38 }, o.pad || {});
      ctx.clearRect(0, 0, w, h);
      const X = (v) => P.l + (v - o.xMin) / (o.xMax - o.xMin) * (w - P.l - P.r);
      const Y = (v) => h - P.b - (v - o.yMin) / (o.yMax - o.yMin) * (h - P.t - P.b);
      ch.X = X; ch.Y = Y; ch.P = P; ch.w = w; ch.h = h;
      ctx.font = '11px system-ui,sans-serif'; ctx.textBaseline = 'middle';
      // bandas
      for (const b of o.bands || []) { ctx.fillStyle = b.color; ctx.fillRect(X(b.x0), P.t, X(b.x1) - X(b.x0), h - P.t - P.b); }
      // rejilla y

      ctx.strokeStyle = '#1c2836'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(P.l, P.t); ctx.lineTo(P.l, h - P.b); ctx.lineTo(w - P.r, h - P.b); ctx.stroke();

      // líneas verticales/horizontales de referencia

      for (const v of o.hlines || []) { const y = Y(v.y); ctx.strokeStyle = v.color || '#888'; ctx.setLineDash(v.dash || [4, 4]); ctx.beginPath(); ctx.moveTo(P.l, y); ctx.lineTo(w - P.r, y); ctx.stroke(); ctx.setLineDash([]); if (v.label) { ctx.fillStyle = v.color || '#888'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(v.label, w - P.r - 2, y - 2); } }

        let first = true; for (const p of s.pts) { if (p[1] == null || !isFinite(p[1])) { first = true; continue; } first ? ctx.moveTo(X(p[0]), Y(p[1])) : ctx.lineTo(X(p[0]), Y(p[1])); first = false; }

      for (const m of o.markers || []) { ctx.fillStyle = m.color || '#b4531d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(m.x), Y(m.y), m.r || 5, 0, 7); ctx.fill(); ctx.stroke(); if (m.label) { ctx.fillStyle = m.color || '#b4531d'; ctx.textAlign = m.align || 'left'; ctx.textBaseline = 'bottom'; ctx.font = 'bold 11px system-ui'; ctx.fillText(m.label, X(m.x) + (m.align === 'right' ? -8 : 8), Y(m.y) - 4); ctx.font = '11px system-ui'; } }

    });
    ch.draw = (o) => { ch.opts = o; st.redraw(); };
    ch.st = st;
    ch.xAt = (e) => { const [x] = st.pos(e); const o = ch.opts; return o.xMin + (x - P.l) / (st.w - P.l - P.r) * (o.xMax - o.xMin); };

  H.monthTicks = () => H.MES3.map((m, i) => ({ v: H.doyOf(new Date(Date.UTC(H.year, i, 15))), label: m }));

  /* ---------- notas de corrección del manual ---------- */
  H.fix = (title, items) => H.html(`<div class="fix"><div class="fh">Corrección respecto al manual${title ? ' · ' + title : ''}</div><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`);
  H.info = (html) => H.html(`<div class="info">${html}</div>`);

  /* ---------- autoevaluación ---------- */
  H.selfCheck = (qs, title = 'Autoevaluación') => {
    const box = H.h('div', { class: 'selfcheck' });

    box.append(H.h('h3', {}, title, score));
    let ok = 0, done = 0;
    qs.forEach((q, i) => {
      const fb = H.h('div', { class: 'fb' });
      const opts = H.h('div', { class: 'opts' });
      q.opts.forEach((o, j) => {
        const b = H.h('button', { class: 'opt', type: 'button', html: `<span class="l">${'abcd'[j]})</span><span>${o}</span>` });
        b.onclick = () => {
          H.$$('.opt', opts).forEach((x, k) => { x.disabled = true; if (k === q.a) x.classList.add('ok'); });
          const good = j === q.a; if (!good) b.classList.add('ko');

          fb.className = 'fb show ' + (good ? 'ok' : 'ko');

    });

    box.append(reset);
    return box;
  };
  H.openQ = (q, ans) => H.html(`<details class="open-q"><summary>${q}</summary><div class="ans">${ans}</div></details>`);

  /* ---------- municipio (estado global) ---------- */
  const PROVS = MUN.p;

  H.place = DEF;
  try { const s = JSON.parse(localStorage.getItem('geo-place') || localStorage.getItem('t1-place') || 'null'); if (s && isFinite(s.lat)) H.place = s; } catch (e) { }

  H.nearestMuni = (lat, lon) => { let best = null, bd = 1e9; for (const m of MUNI) { const d = H.haversine(lat, lon, m.lat, m.lon); if (d < bd) { bd = d; best = m; } } return { m: best, d: bd }; };

  H.openPlacePicker = () => {
    const bg = H.$('#place-modal'); bg.classList.add('show');

  };
  const buildModal = () => {
    const bg = H.html(`<div class="modal-bg" id="place-modal" role="dialog" aria-modal="true" aria-labelledby="pm-t">
      <div class="modal">
        <h3 id="pm-t">¿Desde dónde estudias?</h3>

        <input type="text" id="mun-q" placeholder="p. ej. Logroño, Vigo, Arrecife…" autocomplete="off">
        <ul class="sugg" id="mun-list"></ul>
        <div class="alt">
          <button class="btn ghost sm" id="geo-btn" type="button">📍 Usar mi ubicación</button>
          <div><label class="small">Latitud (°, N +)</label><input type="number" id="c-lat" step="0.01" min="-89.9" max="89.9" placeholder="43,25"></div>
          <div><label class="small">Longitud (°, E +)</label><input type="number" id="c-lon" step="0.01" min="-180" max="180" placeholder="-2,93"></div>
          <button class="btn sm" id="c-ok" type="button">Usar coordenadas</button>

      </div></div>`);
    document.body.append(bg);

    let res = [], sel = 0;
    const render = () => { list.innerHTML = ''; res.forEach((m, i) => { const li = H.h('li', { class: i === sel ? 'sel' : '' }, H.h('span', {}, m.name), H.h('small', {}, `${m.prov} · ${H.f(m.lat, 2)}°, ${H.f(m.lon, 2)}°`)); li.onclick = () => pick(m); list.append(li); }); };

    H.$('#pm-close', bg).onclick = () => bg.classList.remove('show');
    bg.addEventListener('click', (e) => { if (e.target === bg) bg.classList.remove('show'); });
    H.$('#c-ok', bg).onclick = () => {
      const la = parseFloat(H.$('#c-lat', bg).value), lo = parseFloat(H.$('#c-lon', bg).value);

      const nm = H.nearestMuni(la, lo);

    };

    };
  };

  /* ---------- pestañas ---------- */
  H.TABS = [];

  };
  H.start = () => {
    const nav = H.$('nav.tabs'), main = H.$('main');
    H.GROUPS.forEach(([g, ids0], gi) => {

/* ============================================================
   Tema 2 · utilidades compartidas: estaciones, atmósfera tipo,

const T2 = (() => {

  const tenth = (a) => (a ? a.map((v) => (v == null ? null : v / 10)) : null);

    const order = ['España', 'Ecuatorial', 'Ecuatorial de montaña', 'Tropical', 'Desértico / árido', 'Mediterráneo', 'Subtropical húmedo', 'Oceánico', 'Subpolar oceánico', 'Continental', 'Subártico', 'Polar'];
    for (const g of order) {
      if (!groups[g]) continue;

      groups[g].sort((a, b) => a.name.localeCompare(b.name, 'es')).forEach((s) => og.append(H.h('option', { value: s.id, selected: s.id === value }, T.stLabel(s))));

/* ============================================================
   Tema 3 · utilidades: estaciones con precipitación, rejillas,
   mapas (costas, isolíneas, flechas de viento), escalas de color

    for (const g of order) {
      if (!groups[g]) continue;
      const og = H.h('optgroup', { label: g === 'España' ? 'España' : 'Mundo · ' + g });
      groups[g].sort((a, b) => a.name.localeCompare(b.name, 'es')).forEach((s) => og.append(H.h('option', { value: s.id, selected: s.id === value }, T.stLabel(s))));
      sel.append(og);
    }

    sel.set = (id) => { sel.value = id; };

  };

  /* ---------- altitud del municipio (si la tabla de altitudes está disponible) ---------- */
  T.placeAlt = () => {
    if (H.place.alt != null) return H.place.alt;
    const m = H.place.es && H.findMuni(H.place.name);
    return m && m.alt != null ? m.alt : null;
  };

  /* ---------- rejillas codificadas ----------
     cadena: base64 de int16 little-endian (valor = entero × scale)

      const x0 = Math.floor(fx), y0 = Math.floor(fy), x1 = wrap ? (x0 + 1) % nx : Math.min(nx - 1, x0 + 1), y1 = Math.min(ny - 1, y0 + 1), u = fx - x0, v = fy - y0;

    const BBOX = [-32, 32, 26, 64];

      { k: 'A', lon: -24, lat: 38, a: 14, sx: 1000, sy: 800, ang: 0 },
      { k: 'B', lon: -12, lat: 58, a: -22, sx: 650, sy: 600, ang: 0 },

    const s = { C: PRESET(), fill: true, wind: false, mode: 'lab', drag: null, ask: null, ok: 0, n: 0, pick: null, vt: 8 };
    const KM = 111.2;

/* ===================== H · ASCENSO ADIABÁTICO, ESTABILIDAD Y FOEHN ===================== */
H.tab({

      'Manual: 3.3.1 y 3.3.2<br>Figs. 3.16 y 3.17'));

    /* ================= A · diagrama de ascenso ================= */
    const s = { t: 20, hr: 57.8, env: 6.5, zTop: 12000, anim: null };

      P.lfc = lfc; P.el = lfc != null ? (el2 || s.zTop) : null;
    };
    const cv = H.h('canvas'), PAD = { l: 52, r: 16, t: 14, b: 38 }, TX = [-60, 40];

      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.font = '11px system-ui'; ctx.strokeStyle = 'rgba(28,40,54,.08)'; ctx.fillStyle = '#5a6878';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let z = 0; z <= s.zTop; z += 1000) { ctx.beginPath(); ctx.moveTo(PAD.l, Y(z)); ctx.lineTo(w - PAD.r, Y(z)); ctx.stroke(); ctx.fillText(H.f(z), PAD.l - 6, Y(z)); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let t = TX[0]; t <= TX[1]; t += 10) { ctx.beginPath(); ctx.moveTo(X(t), PAD.t); ctx.lineTo(X(t), h - PAD.b); ctx.stroke(); ctx.fillText(t + ' °C', X(t), h - PAD.b + 5); }
      ctx.save(); ctx.translate(13, (PAD.t + h - PAD.b) / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('Altitud (m)', 0, 0); ctx.restore();
      ctx.strokeStyle = '#1c2836'; ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, h - PAD.b); ctx.lineTo(w - PAD.r, h - PAD.b); ctx.stroke();
      // nube
      if (P.lcl != null) {
        const top = P.el != null ? P.el : Math.min(s.zTop, P.lcl + 600);
        const xm = X(P.tLcl);
        ctx.fillStyle = P.el != null ? 'rgba(150,160,175,.32)' : 'rgba(150,160,175,.2)';
        const xc = Math.max(PAD.l + 60, Math.min(w - PAD.r - 60, xm + 90)), wc = 80;
        ctx.beginPath(); ctx.moveTo(xc - wc, Y(P.lcl)); ctx.lineTo(xc + wc, Y(P.lcl));
        if (P.el != null) { ctx.quadraticCurveTo(xc + wc * 1.15, Y((P.lcl + top) / 2), xc + wc * 0.55, Y(top)); ctx.lineTo(xc + wc * 1.35, Y(top) - 2); ctx.lineTo(xc - wc * 1.35, Y(top) - 2); ctx.lineTo(xc - wc * 0.55, Y(top)); ctx.quadraticCurveTo(xc - wc * 1.15, Y((P.lcl + top) / 2), xc - wc, Y(P.lcl)); }
        else { ctx.lineTo(xc + wc, Y(top)); ctx.lineTo(xc - wc, Y(top)); }

        ctx.setLineDash([4, 4]); ctx.strokeStyle = '#1f6f8b'; ctx.beginPath(); ctx.moveTo(PAD.l, Y(P.lcl)); ctx.lineTo(w - PAD.r, Y(P.lcl)); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#1f6f8b'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('nivel de condensación ' + H.f(P.lcl) + ' m', PAD.l + 4, Y(P.lcl) - 2);
      }
      // adiabática seca de referencia
      ctx.strokeStyle = 'rgba(180,83,29,.3)'; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(X(s.t), Y(0)); ctx.lineTo(X(s.t - T3.DALR * s.zTop / 1000), Y(s.zTop)); ctx.stroke(); ctx.setLineDash([]);

      // animación
      if (s.anim != null) { const i = Math.min(P.z.length - 1, s.anim); ctx.fillStyle = '#b4531d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(P.t[i]), Y(P.z[i]), 8, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#1c2836'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'left'; ctx.fillText(`${H.f(P.z[i])} m · ${T3.fT(P.t[i])}`, X(P.t[i]) + 12, Y(P.z[i])); }

    const stab = () => {

    };
    const upd = () => {
      compute();
      const td = tdOf();
      ro.td.v.textContent = T3.fT(td);
      ro.lcl.v.innerHTML = P.lcl == null ? '<small>por encima del gráfico</small>' : `${H.f(P.lcl)} <small>m</small>`;
      ro.esp.v.innerHTML = `${H.f(T3.espy(s.t, td))} <small>m</small>`;
      ro.tl.v.textContent = P.lcl == null ? '—' : T3.fT(P.tLcl);
      ro.mr.v.innerHTML = P.lcl == null ? '—' : `${H.f(T3.malr(P.tLcl, T3.pStd(P.lcl)) / 10, 2)} <small>°C/100 m</small>`;
      const [sn, sx] = stab(); ro.st.v.innerHTML = `${sn}<br><small>${sx}</small>`;
      ro.top.v.innerHTML = P.el == null ? '<small>sin convección libre</small>' : `${H.f(P.el)} <small>m</small>`;

    const go = H.h('button', { class: 'btn acc sm', type: 'button' }, '▲ Elevar la burbuja');
    go.onclick = () => { s.anim = 0; const top = P.el != null ? P.z.findIndex((z) => z >= P.el) : (P.lcl != null ? P.z.findIndex((z) => z >= P.lcl + 1500) : P.z.length - 1); const end = top < 0 ? P.z.length - 1 : top; const t0 = performance.now(); const fr = (now) => { s.anim = Math.round((now - t0) / 3000 * end); cs.redraw(); if (s.anim < end) requestAnimationFrame(fr); }; requestAnimationFrame(fr); };

    el.append(H.h('div', { class: 'card' }, H.h('h3', {}, 'Diagrama de ascenso: del aire seco a la nube'),

    /* comparación con la fig. 3.16 */
    const m = T3.parcel({ t0: 20, td0: T3.tdFromHR(20, 10 / T2.rhoSat(20) * 100), dz: 10, zTop: 2000 });
    const i13 = m.z.findIndex((z) => z >= 1300);
    el.append(H.h('div', { class: 'card', style: { background: 'var(--soft)' } }, H.h('h4', {}, 'La fig. 3.16 con números actuales'),
      H.html(`<div style="overflow-x:auto"><table class="t"><thead><tr><th></th><th>Manual</th><th>Cálculo completo</th></tr></thead><tbody>

        <tr><td>Nivel de condensación</td><td class="bad">900 m, a 11 °C</td><td class="good">${H.f(m.lcl)} m, a ${T3.fT(m.tLcl)}</td></tr>
        <tr><td>Gradiente húmedo</td><td>0,5 °C/100 m</td><td>${H.f(T3.malr(m.tLcl, T3.pStd(m.lcl)) / 10, 2)} °C/100 m en la base de la nube</td></tr>
        <tr><td>A 1.300 m</td><td>9 °C · 8,5 g/m³ · condensados 1,5 g/m³</td><td>${T3.fT(m.t[i13])} · condensados ${H.f(m.cond[i13] * T3.rho(m.t[i13], m.p[i13]), 2)} g/m³</td></tr>
      </tbody></table></div>`),
      H.html('<p class="small">El manual supone que el aire conserva sus 10 g/m³ al subir y que se satura cuando su temperatura llega al punto de rocío de superficie (11 °C). En realidad el aire se expande al ascender (su vapor por metro cúbico disminuye) y su punto de rocío baja unos 0,18 °C cada 100 m, así que la condensación empieza más arriba: unos 125 m por cada grado de diferencia entre la temperatura y el punto de rocío.</p>')));

    /* ================= B · efecto foehn ================= */
    const f = { t: 18, hr: 70, H: 2000, rain: 100 };
    const foehn = () => {
      const up = T3.parcel({ t0: f.t, td0: T3.tdFromHR(f.t, f.hr), zTop: f.H, dz: 10 });
      const n = up.z.length - 1, tTop = up.t[n], condTop = up.cond[n] / 1000; // kg/kg
      let liq = condTop * (1 - f.rain / 100), t = tTop, w = T3.mixing(T3.esW(up.td[n]), up.p[n]); const down = { z: [], t: [] };
      for (let z = f.H; z >= 0; z -= 10) {

        box.dataset.done = '1'; let ok = 0; const weak = {};
        H.$$('.q', list).forEach((qe, i) => {
          const q = qs[i], good = answers[i] === q.a; if (good) ok++; else weak[q.tab] = (weak[q.tab] || 0) + 1;
          H.$$('.opt', qe).forEach((x, k) => { x.disabled = true; x.style.background = ''; x.style.borderColor = ''; if (k === q.a) x.classList.add('ok'); else if (k === answers[i]) x.classList.add('ko'); });
          const t = H.TABS.find((x) => x.id === q.tab);
          const fb = H.$('.fb', qe); fb.className = 'fb show ' + (good ? 'ok' : 'ko'); fb.innerHTML = `<b>${good ? 'Correcto.' : answers[i] === null ? 'Sin responder.' : 'No es correcto.'}</b>${q.ex} <a href="#${q.tab}">Repasar en «${t.nav}» →</a>`;
        });
        const nota = ok / qs.length * 10;
        const wk = Object.entries(weak).sort((a, b) => b[1] - a[1]).map(([k, n]) => { const t = H.TABS.find((x) => x.id === k); return `<a href="#${k}">${t.nav}</a> (${n})`; });
        result.innerHTML = `<div class="result-box"><div class="big">${H.f(nota, 1)}</div><div>${ok} aciertos de ${qs.length}</div>${wk.length ? `<p class="small">Conviene repasar: ${wk.join(' · ')}</p>` : '<p class="small">Ningún fallo. Tema dominado.</p>'}</div>`;
        corr.style.display = 'none'; again.style.display = ''; result.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      again.onclick = () => { delete box.dataset.done; build(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      box.append(prog, list, result, H.h('div', { class: 'exam-nav' }, corr, again));
    };
    build();
    el.append(box);
  },
});

H.start();

</script>
</body>
</html>
